[project]
name = "benchsuite"
version = "0.1.0"
description = "sitegen + minisheet"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest", "playwright"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sitegen", "src/minisheet"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
