<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taro plugin — UI mockup</title>
<style>
  :root {
    --background: #0e0e10; --surface: #161618; --surface-raised: #1d1d20; --surface-hover: #242428;
    --border: #2a2a2e; --text: #e6e6e9; --text-muted: #9a9aa2; --text-faint: #6b6b73;
    --green: #3fb950; --amber: #d29922; --red: #f85149; --blue: #58a6ff; --violet: #a371f7;
    --accent: #e8c547; --brand: #d9825b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--background); color: var(--text); font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; height: 100vh; overflow: hidden; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .app { display: grid; grid-template-columns: 236px 1fr; height: 100vh; }
  .spacer { flex: 1; }

  /* Paseo sidebar */
  .paseo-sidebar { background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 10px 8px; gap: 2px; overflow-y: auto; }
  .paseo-brand { font-weight: 600; padding: 4px 8px 12px; color: var(--text-muted); }
  .sidebar-row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; color: var(--text-muted); border: 0; background: none; text-align: left; width: 100%; }
  .sidebar-row:hover { background: var(--surface-hover); color: var(--text); }
  .sidebar-row.active { background: var(--surface-raised); color: var(--text); }
  .sidebar-row .count { margin-left: auto; background: var(--accent); color: #111; border-radius: 9px; padding: 0 6px; font-size: 11px; font-weight: 700; }
  .sidebar-section { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-faint); padding: 14px 8px 4px; }
  .sidebar-agent { padding-left: 26px; font-size: 12px; }
  .plugin-tag { font-size: 10px; color: var(--text-faint); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; margin-left: 4px; }

  /* Taro screen */
  .screen { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .screen-header { display: flex; align-items: center; gap: 4px; padding: 8px 14px; border-bottom: 1px solid var(--border); background: var(--surface); }
  .screen-title { font-weight: 600; margin-right: 14px; }
  .tab { border: 1px solid transparent; background: none; padding: 5px 11px; border-radius: 6px; color: var(--text-muted); display: flex; gap: 6px; align-items: center; }
  .tab:hover { background: var(--surface-hover); }
  .tab.active { background: var(--surface-raised); border-color: var(--border); color: var(--text); }
  .badge { background: var(--accent); color: #111; border-radius: 9px; padding: 0 6px; font-size: 11px; font-weight: 700; }
  .icon-button { width: 30px; height: 30px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface-raised); color: var(--text-muted); display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .icon-button:hover { color: var(--text); }
  .screen-body { flex: 1; display: grid; grid-template-columns: 400px 1fr; min-height: 0; }

  /* Conversation pane */
  .conversation { border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; background: var(--background); }
  .conversation-header { padding: 10px 14px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 4px; }
  .breadcrumb { border: 0; background: none; padding: 0; color: var(--blue); font-size: 12px; text-align: left; }
  .conversation-title { font-weight: 600; display: flex; gap: 8px; align-items: center; }
  .conversation-subtitle { color: var(--text-faint); font-size: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .link-button { border: 0; background: none; padding: 0; color: var(--blue); font-size: 12px; }
  .conversation-tabs { display: flex; gap: 2px; margin-top: 4px; }
  .conversation-tabs button { border: 0; background: none; padding: 4px 10px; border-radius: 5px; color: var(--text-muted); font-size: 12px; }
  .conversation-tabs button.active { background: var(--surface-raised); color: var(--text); }
  .messages { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .message { max-width: 92%; padding: 9px 12px; border-radius: 10px; white-space: pre-wrap; }
  .message.user { align-self: flex-end; background: #23324a; }
  .message.agent { align-self: flex-start; background: var(--surface-raised); border: 1px solid var(--border); }
  .message.tool { align-self: flex-start; color: var(--text-faint); font-family: ui-monospace, monospace; font-size: 11.5px; padding: 2px 4px; }
  .message.system { align-self: center; color: var(--text-faint); font-size: 11.5px; }
  .question-card { border: 1px solid var(--accent); background: #2a2614; border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .question-card .question-label { color: var(--accent); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
  .suggestions { padding: 8px 14px 0; display: flex; flex-wrap: wrap; gap: 6px; }
  .suggestion { border: 1px solid var(--border); background: var(--surface-raised); border-radius: 14px; padding: 4px 10px; font-size: 12px; display: flex; gap: 6px; align-items: center; }
  .suggestion:hover { border-color: var(--accent); }
  .suggestion .dismiss { color: var(--text-faint); }
  .action-bar { display: flex; gap: 6px; padding: 8px 14px 0; align-items: center; }
  .composer { margin: 10px 14px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); padding: 10px 12px; color: var(--text-faint); display: flex; justify-content: space-between; align-items: center; min-height: 44px; gap: 8px; }
  .send-button { background: var(--brand); border: 0; color: #fff; border-radius: 8px; width: 34px; height: 30px; flex: none; }
  .small-button { border: 1px solid var(--border); background: var(--surface-raised); border-radius: 6px; padding: 3px 9px; font-size: 12px; }
  .small-button:hover { background: var(--surface-hover); }
  .primary-button { border: 0; background: var(--green); color: #07130a; font-weight: 600; border-radius: 6px; padding: 4px 11px; font-size: 12px; }
  .warning-button { border: 1px solid var(--amber); background: none; color: var(--amber); border-radius: 6px; padding: 3px 10px; font-size: 12px; }

  .ticket-detail { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 14px; }
  .detail-section h4 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-faint); }
  .detail-section ul { margin: 0; padding-left: 18px; }
  .timeline-row { display: grid; grid-template-columns: 74px 1fr; gap: 8px; font-size: 12px; padding: 3px 0; border-bottom: 1px dashed var(--border); }
  .timeline-row span:first-child { color: var(--text-faint); }

  /* Board */
  .board-area { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .board-toolbar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
  .board-toolbar .project-name { font-weight: 600; }
  .board-toolbar .manager-status { color: var(--text-faint); font-size: 12px; display: flex; align-items: center; gap: 6px; }
  .board { flex: 1; display: grid; grid-template-columns: repeat(5, minmax(190px, 1fr)); gap: 10px; padding: 12px 14px; overflow: auto; align-items: start; }
  .column { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; display: flex; flex-direction: column; min-height: 120px; }
  .column-header { padding: 8px 10px; display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 12px; border-bottom: 1px solid var(--border); }
  .column-header .column-count { color: var(--text-faint); font-weight: 400; }
  .column-header .column-hint { margin-left: auto; color: var(--text-faint); font-weight: 400; font-size: 11px; }
  .column-cards { padding: 8px; display: flex; flex-direction: column; gap: 8px; }
  .column.needs-you { border-color: #5a4a14; }
  .column.needs-you .column-header { color: var(--accent); }
  .column.stalled .column-header { color: var(--red); }
  .empty-column { color: var(--text-faint); font-size: 12px; padding: 6px 4px; }
  .card { background: var(--surface-raised); border: 1px solid var(--border); border-radius: 8px; padding: 9px 10px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; }
  .card:hover { border-color: #3d3d44; }
  .card.selected { border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue); }
  .card-top { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-faint); white-space: nowrap; }
  .card-title { font-weight: 550; }
  .card-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 11px; }
  .phase { border-radius: 4px; padding: 0 6px; font-size: 10.5px; font-weight: 600; border: 1px solid; white-space: nowrap; }
  .phase.planning { color: var(--violet); border-color: #4b3772; }
  .phase.implementing { color: var(--blue); border-color: #234a73; }
  .phase.reviewing { color: #56d4dd; border-color: #1f5a5e; }
  .phase.awaiting { color: var(--accent); border-color: #5a4a14; }
  .phase.blocked { color: var(--red); border-color: #6b2a27; }
  .phase.queued { color: var(--text-muted); border-color: var(--border); }
  .phase.done { color: var(--green); border-color: #24542e; }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none; }
  .live-dot.running { background: var(--green); box-shadow: 0 0 6px var(--green); animation: pulse 1.6s infinite; }
  .live-dot.idle { background: var(--text-faint); }
  .live-dot.permission { background: var(--accent); }
  @keyframes pulse { 50% { opacity: .35; } }
  .pr-link { color: var(--blue); }
  .milestone { color: var(--text-muted); font-size: 12px; }
  .call { border-top: 1px solid var(--border); padding-top: 6px; display: flex; flex-direction: column; gap: 6px; }
  .call-label { color: var(--accent); font-size: 12px; font-weight: 600; }
  .call-buttons { display: flex; gap: 6px; flex-wrap: wrap; }
  .answer-box { display: flex; gap: 6px; }
  .answer-box input { flex: 1; min-width: 0; background: var(--background); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 3px 8px; font-size: 12px; }
  .children-toggle { border: 0; background: none; padding: 0; color: var(--text-muted); font-size: 11.5px; text-align: left; }
  .children { display: flex; flex-direction: column; gap: 3px; border-left: 2px solid var(--border); margin-left: 2px; }
  .child { display: flex; gap: 6px; align-items: center; font-size: 11.5px; padding-left: 6px; }
  .progress { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .progress > div { height: 100%; background: var(--green); }
  .inbox { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 18px; }
  .inbox-group h3 { margin: 0 0 8px; font-size: 12px; color: var(--text-muted); display: flex; gap: 8px; align-items: center; }
  .inbox-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }

  /* Setup / settings page */
  .setup { flex: 1; overflow-y: auto; }
  .setup-inner { max-width: 760px; margin: 0 auto; padding: 24px 24px 60px; display: flex; flex-direction: column; gap: 22px; }
  .setup h1 { font-size: 20px; margin: 0; }
  .setup .lead { color: var(--text-muted); margin: 4px 0 0; }
  .setup-section { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .setup-section h2 { font-size: 13px; margin: 0; display: flex; gap: 8px; align-items: center; }
  .step-number { width: 20px; height: 20px; border-radius: 50%; background: var(--surface-hover); color: var(--text-muted); font-size: 11px; display: inline-flex; align-items: center; justify-content: center; }
  .field { display: grid; grid-template-columns: 170px 1fr; gap: 12px; align-items: start; }
  .field label { color: var(--text-muted); padding-top: 6px; }
  .hint { color: var(--text-faint); font-size: 12px; margin-top: 4px; }
  .input, .select { background: var(--background); border: 1px solid var(--border); border-radius: 7px; color: var(--text); padding: 6px 9px; font: inherit; width: 100%; }
  .row-inputs { display: grid; grid-template-columns: 1fr 120px; gap: 8px; }
  .choice-group { display: flex; flex-direction: column; gap: 6px; }
  .choice { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; cursor: pointer; }
  .choice.selected { border-color: var(--blue); background: #15202e; }
  .choice .choice-title { font-weight: 550; }
  .choice .choice-description { color: var(--text-faint); font-size: 12px; }
  .radio { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--text-faint); margin-top: 2px; flex: none; }
  .choice.selected .radio { border-color: var(--blue); background: radial-gradient(var(--blue) 40%, transparent 45%); }
  .check-row { display: flex; gap: 10px; align-items: center; padding: 2px 0; flex-wrap: wrap; }
  .check-row .ok { color: var(--green); }
  .check-row .check-detail { color: var(--text-faint); font-size: 12px; }
  .banner { border: 1px solid #2f4a70; background: #15202e; border-radius: 8px; padding: 10px 12px; color: #c9d7ea; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .role-grid { display: grid; grid-template-columns: 110px 1fr 110px 130px; gap: 8px; align-items: center; }
  .role-grid .role-name { font-weight: 550; }
  .role-grid .role-head { color: var(--text-faint); font-size: 11px; }
  .setup-footer { display: flex; gap: 10px; justify-content: flex-end; align-items: center; flex-wrap: wrap; }
  .big-button { border: 0; background: var(--green); color: #07130a; font-weight: 700; border-radius: 8px; padding: 9px 16px; }
  .danger-link { color: var(--red); border: 0; background: none; font-size: 12px; }

  .toast { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); background: var(--surface-raised); border: 1px solid var(--green); padding: 8px 14px; border-radius: 8px; z-index: 50; display: none; max-width: 90vw; }
  .version-switch { position: fixed; bottom: 10px; right: 14px; font-size: 11px; color: var(--text-faint); z-index: 5; }
  .version-switch a { color: var(--text-muted); }

  /* ---------- Compact (phone) ---------- */
  body.compact .app { grid-template-columns: 1fr; }
  body.compact .paseo-sidebar, body.compact .version-switch { display: none; }
  body.compact { font-size: 14px; }
  .mobile-host-bar { height: 50px; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid var(--border); font-size: 16px; flex: none; gap: 8px; }
  .mobile-header { padding: 12px 14px 10px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; flex: none; }
  .mobile-header-top { display: flex; align-items: center; gap: 8px; }
  .project-pill { display: flex; align-items: center; gap: 7px; background: var(--surface-raised); border: 1px solid var(--border); border-radius: 18px; padding: 6px 12px; font-size: 15px; }
  .mobile-summary { color: var(--text-faint); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .segment { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 3px; margin: 10px 14px 0; flex: none; }
  .segment button { flex: 1; border: 0; background: none; padding: 8px 4px; border-radius: 8px; color: var(--text-muted); font-size: 14px; display: flex; justify-content: center; gap: 5px; align-items: center; }
  .segment button.active { background: var(--brand); color: #fff; font-weight: 600; }
  .segment .badge { font-size: 10px; }
  .mobile-body { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .column-chips { display: flex; gap: 6px; padding: 10px 14px; overflow-x: auto; flex: none; }
  .column-chip { border: 1px solid var(--border); background: var(--surface); border-radius: 16px; padding: 5px 11px; white-space: nowrap; color: var(--text-muted); font-size: 13px; }
  .column-chip.active { border-color: var(--text); color: var(--text); }
  .column-chip.attention { color: var(--accent); }
  .column-chip.attention.active { border-color: var(--accent); }
  .mobile-list { flex: 1; overflow-y: auto; padding: 4px 14px 20px; display: flex; flex-direction: column; gap: 10px; }
  .project-sheet-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 40; display: flex; align-items: flex-end; }
  .project-sheet { width: 100%; background: var(--surface); border-radius: 16px 16px 0 0; padding: 10px 10px 24px; border-top: 1px solid var(--border); }
  .sheet-handle { width: 40px; height: 4px; background: var(--border); border-radius: 2px; margin: 4px auto 12px; }
  .sheet-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px; border: 0; background: none; border-radius: 10px; text-align: left; font-size: 15px; }
  .sheet-item.active { background: var(--surface-raised); }
  .sheet-item .sheet-detail { color: var(--text-faint); font-size: 12.5px; }
  body.compact .field { grid-template-columns: 1fr; gap: 4px; }
  body.compact .field label { padding-top: 0; }
  body.compact .setup-inner { padding: 16px 14px 40px; }
  body.compact .role-grid { grid-template-columns: 1fr 1fr 1fr; }
  body.compact .role-grid .role-head { display: none; }
  body.compact .role-grid .role-name { grid-column: 1 / -1; margin-top: 6px; }
  body.compact .message { max-width: 96%; }
  body.compact .composer { min-height: 64px; align-items: flex-end; }
  body.compact .card { padding: 11px 12px; }
  body.compact .phase { font-size: 11px; }
</style>
</head>
<body>
<div class="app">
  <aside class="paseo-sidebar" id="paseo-sidebar"></aside>
  <main class="screen" id="screen"></main>
</div>
<div class="toast" id="toast"></div>
<div id="overlay"></div>
<div class="version-switch">v1 · <a href="phone.html">phone preview</a> · <a href="v2.html">v2</a></div>

<script>
const compact = window.innerWidth < 700;
if (compact) document.body.classList.add("compact");

const PROJECTS = {

  { id: "SH-010", project: "shop", title: "Round discount to slider step", phase: "done", phaseLabel: "Done", agentState: null, pullRequest: "#276", milestone: "Accepted Oct 10", column: "done" },

const COLUMNS = [
  { id: "needs-you", label: "Needs you", hint: "your move" },
  { id: "working", label: "Working", hint: "agent running" },
  { id: "stalled", label: "Stalled", hint: "idle, no reason" },

  { id: "done", label: "Done", hint: "accepted" },
];

const SUGGESTIONS = {
  "manager:shop": ["Accept SH-012", "Approve the SH-015 plan", "Nudge SH-013 to resume"],
  "manager:shop-api": ["Unblock SA-004"],
  "SH-012": ["Accept SH-012", "Ask for a screenshot on iPhone SE"],
  "SH-015": ["Approve plan", "Cap retries at 3 instead"],
  "SH-013": ["Resume where you stopped"],
};

function transcriptFor(key) {
  const transcripts = {
    "manager:shop": [
      { role: "user", text: "the order backfill should recompute affected totals, not just insert" },
      { role: "tool", text: "read backend/internal/totals/backfill.go · grep upsert" },
      { role: "agent", text: "Backfill inserts new orders but never recomputes the daily total that contains them, so daily totals drift.\n\nFiled SH-013 · Recompute totals after order backfill, and started its owner. Brainstorm with it from the board." },
      { role: "system", text: "SH-012 → Awaiting acceptance · PR #381" },
      { role: "agent", text: "Needs you (3):\n• SH-012 ready to accept — PR #381\n• SH-015 plan waiting for approval\n• SH-021 asks to start local Mongo + Redis\nSH-013 looks stalled (idle 42m, no reason recorded)." },
    ],
    "manager:shop-api": [
      { role: "system", text: "SA-004 → Blocked: needs SHIPPING_API_KEY" },
      { role: "agent", text: "SA-004 is blocked on a missing shipping API key in the dev environment." },
    ],
    "SH-015": [
      { role: "user", text: "the worker should retry refund pushes that fail" },
      { role: "agent", text: "Before planning, two questions:\n1. Retry forever, or give up and alert?\n2. Should a retry reuse the same timeout?" },
      { role: "user", text: "give up after a while and log it. longer timeout on retry" },
      { role: "agent", text: "Plan:\n• Exponential backoff, 5 attempts, then mark failed + log\n• Each retry raises the request timeout by 25%\n• queue task stays idempotent per (order, attempt)" },
      { role: "question", text: "Approve this plan?", options: ["Approve plan", "Cap retries at 3 instead"] },
    ],
    "SH-012": [
      { role: "tool", text: "Reviewer (Review SH-012) → approved a41c9e2" },
      { role: "agent", text: "Delivered: PR #381 is ready for review.\nMobile shows only the green dot; desktop unchanged; aria-label kept." },
      { role: "question", text: "Accept the delivered result?", options: ["Accept", "Request changes"] },
    ],
    "SH-021": [
      { role: "agent", text: "Adding jittered backoff to the supplier-stock call. I need local Mongo + Redis for the integration test." },
      { role: "question", text: "Permission: run docker compose up -d mongo redis", options: ["Allow", "Deny"] },
    ],
    "SH-013": [
      { role: "tool", text: "go test ./internal/totals/... (started 13:02)" },
      { role: "system", text: "Agent idle since 13:05 — turn ended without a status line" },
    ],
  };
  if (key.startsWith("manager:") && !transcripts[key]) return [{ role: "agent", text: "I've read the repository's AGENTS.md and the empty tracker. Tell me what you need — I'll look into it, file a ticket and start its owner." }];
  return transcripts[key] || [{ role: "agent", text: "Working on it. Latest milestone is on the ticket." }];
}

const state = {
  tab: "inbox", selectedTicketId: null, conversationTab: "chat", expandedChildren: new Set(["SH-014"]),
  view: "screen",              // screen | setup | settings
  mobileTab: "manager",        // manager | inbox | board
  mobileProject: "shop",
  mobileColumn: "needs-you",
  projectSheetOpen: false,
  setup: { projectIndex: 0, sharing: "shared", boundary: "pull-request", merging: "never", review: "independent" },
};

const projectNames = () => Object.keys(PROJECTS);
const findTicket = ticketId => TICKETS.find(ticket => ticket.id === ticketId);
const currentProject = () => compact ? state.mobileProject : (state.tab === "inbox" ? (findTicket(state.selectedTicketId)?.project || projectNames()[0]) : state.tab);
const attentionCount = projectName => TICKETS.filter(ticket => (ticket.column === "needs-you" || ticket.column === "stalled") && (!projectName || ticket.project === projectName)).length;

/* ---------- shared pieces ---------- */
function phaseBadge(ticket) { return `<span class="phase ${ticket.phase}">${ticket.phaseLabel}</span>`; }

function renderCard(ticket, options = {}) {
  const selected = state.selectedTicketId === ticket.id && !compact;
  const childrenDone = ticket.children ? ticket.children.filter(child => child.status === "Done").length : 0;
  const expanded = state.expandedChildren.has(ticket.id);
  return `
  <div class="card ${selected ? "selected" : ""}" onclick="selectTicket('${ticket.id}')">
    <div class="card-top">
      ${ticket.agentState ? `<span class="live-dot ${ticket.agentState}"></span>` : ""}
      <span>${ticket.id}</span>${options.showProject ? `<span>· ${ticket.project}</span>` : ""}
      <span style="margin-left:auto">${phaseBadge(ticket)}</span>
    </div>
    <div class="card-title">${ticket.title}</div>
    ${ticket.pullRequest ? `<div class="card-meta"><span class="pr-link">PR ${ticket.pullRequest}</span></div>` : ""}
    <div class="milestone">${ticket.milestone}</div>
    ${ticket.children ? `
      <div class="progress"><div style="width:${childrenDone / ticket.children.length * 100}%"></div></div>
      <button class="children-toggle" onclick="event.stopPropagation(); toggleChildren('${ticket.id}')">${expanded ? "▾" : "▸"} ${childrenDone}/${ticket.children.length} deliverables</button>
      ${expanded ? `<div class="children">${ticket.children.map(child => `<div class="child"><span class="phase ${child.status === "Done" ? "done" : child.status === "Reviewing" ? "reviewing" : "queued"}">${child.status}</span> ${child.title}</div>`).join("")}</div>` : ""}` : ""}
    ${ticket.stallReason ? `<div class="call" onclick="event.stopPropagation()"><div class="call-label" style="color:var(--red)">${ticket.stallReason}</div><div class="call-buttons"><button class="warning-button" onclick="act('${ticket.id}','Nudge')">Nudge</button><button class="small-button" onclick="act('${ticket.id}','Relaunch')">Relaunch</button></div></div>` : ""}
    ${ticket.call ? `
      <div class="call" onclick="event.stopPropagation()">
        <div class="call-label">${ticket.call.label}</div>
        <div class="call-buttons">${ticket.call.actions.map((action, index) => `<button class="${index === 0 ? "primary-button" : "small-button"}" onclick="act('${ticket.id}', '${action}')">${action}</button>`).join("")}</div>
        ${compact ? "" : `<div class="answer-box"><input placeholder="Answer in your own words…"><button class="small-button" onclick="act('${ticket.id}','answer')">Send</button></div>`}
      </div>` : ""}
  </div>`;
}

function renderMessages(key) {
  return transcriptFor(key).map(message => {
    if (message.role === "question") return `<div class="question-card"><div class="question-label">Waiting on you</div><div>${message.text}</div><div class="call-buttons">${message.options.map((option, index) => `<button class="${index === 0 ? "primary-button" : "small-button"}" onclick="act('${state.selectedTicketId}','${option}')">${option}</button>`).join("")}</div></div>`;
    return `<div class="message ${message.role}">${message.text}</div>`;
  }).join("");
}

function renderTicketDetail(ticket) {
  return `<div class="ticket-detail">
    <div class="detail-section"><h4>Status</h4>${phaseBadge(ticket)} ${ticket.agentState ? `<span class="live-dot ${ticket.agentState}"></span> agent ${ticket.agentState}` : "no agent"}</div>
    <div class="detail-section"><h4>Acceptance criteria</h4><ul><li>☑ Primary behaviour matches the request</li><li>☑ Unchanged elsewhere</li><li>☐ Owner verified on device</li></ul></div>
    <div class="detail-section"><h4>Approval</h4><div class="milestone">“yes go ahead” — owner, Oct 12 14:03</div></div>
    ${ticket.children ? `<div class="detail-section"><h4>Children</h4>${ticket.children.map(child => `<div class="child"><span class="phase ${child.status === "Done" ? "done" : "queued"}">${child.status}</span> ${child.id} ${child.title}</div>`).join("")}</div>` : ""}
    <div class="detail-section"><h4>Delivery</h4><div>${ticket.pullRequest ? `<span class="pr-link">PR ${ticket.pullRequest}</span> · head a41c9e2 · reviewed ✔` : "No PR yet"}</div></div>
    <div class="detail-section"><h4>Milestones</h4>
      <div class="timeline-row"><span>14:10</span><span>Started implementation · base 214995c</span></div>
      <div class="timeline-row"><span>14:31</span><span>Tests green · committed a41c9e2</span></div>
      <div class="timeline-row"><span>14:48</span><span>${ticket.milestone}</span></div>
    </div>
  </div>`;
}

function suggestionsFor(key) {
  const suggestions = SUGGESTIONS[key] || [];
  return suggestions.length ? `<div class="suggestions">${suggestions.map(suggestion => `<button class="suggestion" onclick="sendCommand('${suggestion}')">${suggestion} <span class="dismiss">✕</span></button>`).join("")}</div>` : "";
}

function managerActionBar() {
  return `<div class="action-bar"><button class="small-button" onclick="sendCommand('Bearings')">◎ Bearings</button><button class="small-button" onclick="sendCommand('Ahoy')">⚓ Ahoy</button><span class="spacer"></span><button class="icon-button" title="Compact the manager's context" onclick="toast('Manager compacted')">⤡</button><button class="icon-button" title="Restart the manager" onclick="toast('Restart manager? Its tickets carry over')">↻</button></div>`;
}

function composer(placeholder) { return `<div class="composer"><span>${placeholder}</span><button class="send-button">➤</button></div>`; }

/* ---------- setup / settings ---------- */
function choice(groupKey, value, title, description) {
  const selected = state.setup[groupKey] === value;
  return `<div class="choice ${selected ? "selected" : ""}" onclick="setSetup('${groupKey}','${value}')"><span class="radio"></span><div><div class="choice-title">${title}</div><div class="choice-description">${description}</div></div></div>`;
}
function modelSelect(defaultModel) { return `<select class="select">${["Opus 5.5", "Sonnet 5.5", "Haiku 5.5", "GPT-6.1 Sol", "GPT-6.1 Terra"].map(model => `<option ${model === defaultModel ? "selected" : ""}>${model}</option>`).join("")}</select>`; }
function thinkingSelect(defaultLevel) { return `<select class="select">${["low", "medium", "high"].map(level => `<option ${level === defaultLevel ? "selected" : ""}>${level}</option>`).join("")}</select>`; }
function modeSelect(defaultMode) { return `<select class="select">${["full access", "ask for risky", "plan only"].map(mode => `<option ${mode === defaultMode ? "selected" : ""}>${mode}</option>`).join("")}</select>`; }
function prefixFor(name) { return name.split(/[-.]/).filter(Boolean).map(word => word[0]).join("").toUpperCase().slice(0, 3); }

function renderSetup(isSettings) {
  const candidate = AVAILABLE_PASEO_PROJECTS[state.setup.projectIndex];
  const projectName = isSettings ? currentProject() : candidate.name;
  const prefix = isSettings ? PROJECTS[projectName].prefix : prefixFor(candidate.name);
  return `<div class="setup"><div class="setup-inner">
    <div>
      ${compact ? "" : `<button class="breadcrumb" onclick="closeSetup()">◀ Back to Taro</button>`}
      <h1 style="margin-top:8px">${isSettings ? `${projectName} settings` : "Add a project"}</h1>
      <p class="lead">${isSettings ? "Changes apply to new task owners and reviewers. Running agents keep their settings." : "Taro gives the project its own ticket tracker and a manager. You talk to the manager; it looks into each request, files a ticket and starts a task owner."}</p>
    </div>

    ${isSettings ? "" : `
    <div class="setup-section">
      <h2>Before you start</h2>
      <div class="check-row"><span class="ok">✔</span><span>Paseo agent tools</span><span class="check-detail">on</span></div>
      <div class="check-row"><span class="ok">✔</span><span>GitHub CLI</span><span class="check-detail">signed in as you</span></div>
      <div class="check-row"><span class="ok">✔</span><span>Backlog.md</span><span class="check-detail">bundled with the plugin</span></div>
    </div>`}

    <div class="setup-section">
      <h2><span class="step-number">1</span> Project</h2>
      ${isSettings ? `<div class="field"><label>Repository</label><div>/home/you/code/shop<div class="hint">github.com/example/shop</div></div></div>` : `
      <div class="field"><label>Paseo project</label><div>
        <select class="select" onchange="setSetup('projectIndex', this.selectedIndex)">${AVAILABLE_PASEO_PROJECTS.map((project, index) => `<option ${index === state.setup.projectIndex ? "selected" : ""}>${project.name}</option>`).join("")}</select>
        <div class="hint">${candidate.path} · remote: ${candidate.remote}</div></div></div>`}
      ${!isSettings && candidate.existingTracker ? `<div class="banner">⇄ This repository already has a Taro tracker on <b>origin/taro/backlog</b> (14 tickets).<span class="spacer"></span><button class="small-button" onclick="toast('Connects to the shared tracker; you still pick models below')">Connect to it</button></div>` : ""}
      <div class="field"><label>Base branch · ticket prefix</label><div><div class="row-inputs"><input class="input" value="${isSettings ? "develop" : candidate.defaultBranch}"><input class="input" value="${prefix}"></div><div class="hint">Work branches off the base branch. Tickets look like ${prefix}-001.</div></div></div>
      <div class="field"><label>Tickets</label><div class="choice-group">
        ${choice("sharing", "shared", "Shared through git", "Ticket changes go to a taro/backlog branch, so other machines and teammates see the same board.")}
        ${choice("sharing", "local", "This machine only", "Nothing is pushed.")}
      </div></div>
    </div>

    <div class="setup-section">
      <h2><span class="step-number">2</span> Agents</h2>
      <div class="role-grid">
        <span class="role-head">Role</span><span class="role-head">Model</span><span class="role-head">Thinking</span><span class="role-head">Permissions</span>
        <span class="role-name">Manager</span>${modelSelect(isSettings ? PROJECTS[projectName].managerModel : "Sonnet 5.5")}${thinkingSelect("medium")}${modeSelect("full access")}
      </div>
      <div class="hint">The manager reads and routes, so a mid-size model is enough.</div>
      <div class="field"><label>Task agents</label><div>
        <div style="padding-top:6px">Chosen per task, by complexity</div>
        <div class="hint">The task owner picks the model and thinking level for its work and its reviewers from the models allowed below: small for mechanical changes, strongest for hard problems.</div>
        <div class="call-buttons" style="margin-top:8px">${["Opus 5.5", "Sonnet 5.5", "Haiku 5.5", "GPT-6.1 Sol", "GPT-6.1 Terra", "GPT-6.1 Luna"].map(model => `<span class="suggestion" style="${model.includes("Haiku") ? "opacity:.45" : "border-color:var(--blue)"}">${model.includes("Haiku") ? "○" : "✓"} ${model}</span>`).join("")}</div>
        <div class="hint">Permissions for task agents: ${modeSelect("full access").replace('class="select"', 'class="select" style="width:auto; display:inline-block; margin-left:6px"')}</div>
      </div></div>
      ${isSettings ? `<div class="field"><label>Current manager</label><div><span class="live-dot idle"></span> Manager · ${projectName} (idle, 41% context)<div class="call-buttons" style="margin-top:6px"><button class="small-button" onclick="toast('Opens the manager in Paseo')">Open</button><button class="small-button" onclick="toast('Starts a fresh manager; tickets carry over')">Restart</button><button class="small-button" onclick="toast('Pick a running agent to become the manager')">Adopt another agent</button></div></div></div>` : ""}
    </div>

    <div class="setup-section">
      <h2><span class="step-number">3</span> How work is delivered</h2>
      <div class="field"><label>Finish line</label><div class="choice-group">
        ${choice("boundary", "pull-request", "Pull request, ready for review", "Owner opens a draft PR, gets it reviewed, fixes findings, marks it ready.")}
        ${choice("boundary", "local-review", "Local only", "Owner stops at a verified local commit. Nothing is pushed.")}
      </div></div>
      <div class="field"><label>Review</label><div class="choice-group">
        ${choice("review", "independent", "Independent reviewer", "A separate reviewer agent must approve the final commit.")}
        ${choice("review", "self", "Self-review", "The owner reviews its own diff and runs the checks. Faster, weaker.")}
      </div></div>
      <div class="field"><label>Merging</label><div class="choice-group">
        ${choice("merging", "never", "You merge", "Agents never merge. Done needs your acceptance.")}
        ${choice("merging", "green", "Merge when accepted", "After you accept, the owner merges if checks are green.")}
      </div></div>
    </div>

    <div class="setup-section">
      <h2><span class="step-number">4</span> Standing orders <span style="color:var(--text-faint); font-weight:400">optional</span></h2>
      <textarea class="input" rows="3" placeholder="e.g. Always branch off develop. Run the frontend tests on Node 22.">${isSettings ? "Always branch off develop. Payment features need a sandbox check with every provider." : ""}</textarea>
      <div class="hint">Every agent on this project gets these on top of the repository's own AGENTS.md.</div>
    </div>

    <div class="setup-footer">
      ${isSettings ? `<button class="danger-link" onclick="toast('Removes the project from Taro. Tickets stay on the taro/backlog branch.')">Remove project</button><span class="spacer"></span><button class="small-button" onclick="closeSetup()">Cancel</button><button class="big-button" onclick="saveSettings()">Save</button>`
        : `<button class="small-button" onclick="closeSetup()">Cancel</button><button class="big-button" onclick="createProject()">Create tracker and start manager</button>`}
    </div>
  </div></div>`;
}

/* ---------- desktop ---------- */
function renderSidebar() {
  const total = attentionCount();
  document.getElementById("paseo-sidebar").innerHTML = `
    <div class="paseo-brand">Paseo</div>
    <button class="sidebar-row active" onclick="closeSetup()">🗂️ Taro <span class="plugin-tag">plugin</span>${total ? `<span class="count">${total}</span>` : ""}</button>
    <div class="sidebar-section">Projects</div>
    ${projectNames().map(projectName => `
      <div class="sidebar-row">📁 ${projectName}</div>
      <div class="sidebar-row sidebar-agent">◆ Manager · ${projectName}</div>
      ${TICKETS.filter(ticket => ticket.project === projectName && ticket.agentState).map(ticket => `<div class="sidebar-row sidebar-agent"><span class="live-dot ${ticket.agentState}"></span> ${ticket.id} · ${ticket.title.slice(0, 20)}…</div>`).join("")}`).join("")}`;
}

function renderBoard(projectName) {
  const tickets = TICKETS.filter(ticket => ticket.project === projectName);
  return `
  <div class="board-area">
    <div class="board-toolbar">
      <span class="project-name">${projectName}</span>
      <span class="manager-status"><span class="live-dot idle"></span> Manager ${PROJECTS[projectName].managerStatus}</span>
      <span class="spacer"></span>
      <button class="icon-button" title="Project settings" onclick="openSettings()">⚙</button>
    </div>
    <div class="board">
      ${COLUMNS.map(column => {
        const columnTickets = tickets.filter(ticket => ticket.column === column.id);
        return `<div class="column ${column.id}">
          <div class="column-header">${column.label} <span class="column-count">${columnTickets.length}</span><span class="column-hint">${column.hint}</span></div>
          <div class="column-cards">${columnTickets.length ? columnTickets.map(ticket => renderCard(ticket)).join("") : `<div class="empty-column">—</div>`}</div>
        </div>`;
      }).join("")}
    </div>
  </div>`;
}

function renderInbox() {
  const groups = projectNames().map(projectName => {
    const tickets = TICKETS.filter(ticket => ticket.project === projectName && (ticket.column === "needs-you" || ticket.column === "stalled"));
    if (!tickets.length) return "";
    return `<div class="inbox-group"><h3>📁 ${projectName} <span class="badge">${tickets.length}</span></h3><div class="inbox-grid">${tickets.map(ticket => renderCard(ticket)).join("")}</div></div>`;
  }).join("") || `<div class="empty-column">Nothing needs you right now.</div>`;
  return `<div class="board-area"><div class="board-toolbar"><span class="project-name">Needs you</span><span class="manager-status">across all projects · oldest first</span></div><div class="inbox">${groups}</div></div>`;
}

function renderConversation() {
  const ticket = findTicket(state.selectedTicketId);
  const projectName = ticket ? ticket.project : currentProject();
  const key = ticket ? ticket.id : `manager:${projectName}`;
  const header = ticket ? `
      <button class="breadcrumb" onclick="backToManager()">◀ Manager · ${projectName}</button>
      <div class="conversation-title">${ticket.agentState ? `<span class="live-dot ${ticket.agentState}"></span>` : ""} Task owner · ${ticket.id}</div>
      <div class="conversation-subtitle">${ticket.title} ${phaseBadge(ticket)} ${ticket.agentState ? `<button class="link-button" onclick="toast('Opens the task owner\\'s Paseo tab')">Open in Paseo ↗</button>` : ""}</div>
      <div class="conversation-tabs"><button class="${state.conversationTab === "chat" ? "active" : ""}" onclick="setConversationTab('chat')">Chat</button><button class="${state.conversationTab === "ticket" ? "active" : ""}" onclick="setConversationTab('ticket')">Ticket</button></div>`
    : `<div class="conversation-title"><span class="live-dot idle"></span> Manager · ${projectName}</div>
       <div class="conversation-subtitle">${PROJECTS[projectName].managerModel} · ${PROJECTS[projectName].managerStatus}</div>`;
  const body = ticket && state.conversationTab === "ticket" ? renderTicketDetail(ticket)
    : `<div class="messages">${renderMessages(key)}</div>${suggestionsFor(key)}${ticket ? "" : managerActionBar()}${composer(ticket ? `Message ${ticket.id}'s owner…` : `Tell the ${projectName} manager what you need…`)}`;
  return `<section class="conversation"><div class="conversation-header">${header}</div>${body}</section>`;
}

function renderDesktop() {
  renderSidebar();
  const screen = document.getElementById("screen");
  if (state.view === "setup" || state.view === "settings") { screen.innerHTML = renderSetup(state.view === "settings"); return; }
  const tabs = [`<button class="tab ${state.tab === "inbox" ? "active" : ""}" onclick="setTab('inbox')">📥 Inbox ${attentionCount() ? `<span class="badge">${attentionCount()}</span>` : ""}</button>`]
    .concat(projectNames().map(projectName => `<button class="tab ${state.tab === projectName ? "active" : ""}" onclick="setTab('${projectName}')">${projectName} ${attentionCount(projectName) ? `<span class="badge">${attentionCount(projectName)}</span>` : ""}</button>`))
    .concat([`<button class="tab" onclick="openSetup()">＋ project</button>`]);
  screen.innerHTML = `
    <div class="screen-header"><span class="screen-title">🗂️ Taro</span>${tabs.join("")}</div>
    <div class="screen-body">${renderConversation()}${state.tab === "inbox" ? renderInbox() : renderBoard(state.tab)}</div>`;
}

/* ---------- compact (phone) ---------- */
function renderProjectSheet() {
  return `<div class="project-sheet-backdrop" onclick="closeProjectSheet()"><div class="project-sheet" onclick="event.stopPropagation()">
    <div class="sheet-handle"></div>
    ${projectNames().map(projectName => `<button class="sheet-item ${projectName === state.mobileProject ? "active" : ""}" onclick="switchProject('${projectName}')"><span class="live-dot idle"></span><div><div>${projectName}</div><div class="sheet-detail">manager ${PROJECTS[projectName].managerStatus}</div></div><span class="spacer"></span>${attentionCount(projectName) ? `<span class="badge">${attentionCount(projectName)}</span>` : ""}</button>`).join("")}
    <button class="sheet-item" style="color:var(--text-muted)" onclick="closeProjectSheet(); openSetup()">＋ Add project</button>
  </div></div>`;
}

function renderCompact() {
  const screen = document.getElementById("screen");
  document.getElementById("overlay").innerHTML = state.projectSheetOpen ? renderProjectSheet() : "";
  if (state.view === "setup" || state.view === "settings") {
    screen.innerHTML = `<div class="mobile-host-bar"><button class="breadcrumb" style="font-size:15px" onclick="closeSetup()">‹ Back</button></div>${renderSetup(state.view === "settings")}`;
    return;
  }
  const ticket = findTicket(state.selectedTicketId);
  if (ticket) {
    screen.innerHTML = `
      <div class="mobile-host-bar"><button class="breadcrumb" style="font-size:15px" onclick="backToManager()">‹ Back</button><span class="spacer"></span>${ticket.agentState ? `<button class="icon-button" title="Open in Paseo" onclick="toast('Opens the task owner\\'s Paseo tab')">↗</button>` : ""}</div>
      <div class="mobile-header">
        <div class="mobile-header-top">${ticket.agentState ? `<span class="live-dot ${ticket.agentState}"></span>` : ""}<span style="color:var(--text-faint)">${ticket.id} · ${ticket.project} · task owner</span><span class="spacer"></span>${phaseBadge(ticket)}</div>
        <div style="font-size:17px; font-weight:600">${ticket.title}</div>
      </div>
      <div class="segment"><button class="${state.conversationTab === "chat" ? "active" : ""}" onclick="setConversationTab('chat')">Chat</button><button class="${state.conversationTab === "ticket" ? "active" : ""}" onclick="setConversationTab('ticket')">Ticket</button></div>
      <div class="mobile-body">${state.conversationTab === "ticket" ? renderTicketDetail(ticket) : `<div class="messages">${renderMessages(ticket.id)}</div>${suggestionsFor(ticket.id)}${composer(`Message ${ticket.id}'s owner…`)}`}</div>`;
    return;
  }
  const projectName = state.mobileProject;
  const projectTickets = TICKETS.filter(candidate => candidate.project === projectName);
  const count = columnId => projectTickets.filter(candidate => candidate.column === columnId).length;
  const elsewhere = attentionCount() - attentionCount(projectName);
  let body;
  if (state.mobileTab === "manager") {
    body = `<div class="messages">${renderMessages(`manager:${projectName}`)}</div>${suggestionsFor(`manager:${projectName}`)}${managerActionBar()}${composer(`Tell the ${projectName} manager what you need…`)}`;
  } else if (state.mobileTab === "inbox") {
    const items = TICKETS.filter(candidate => candidate.column === "needs-you" || candidate.column === "stalled");
    body = `<div class="mobile-list" style="padding-top:12px">${items.map(candidate => renderCard(candidate, { showProject: true })).join("") || `<div class="empty-column">Nothing needs you right now.</div>`}</div>`;
  } else {
    body = `
      <div class="column-chips">${COLUMNS.map(column => `<button class="column-chip ${state.mobileColumn === column.id ? "active" : ""} ${column.id === "needs-you" && count(column.id) ? "attention" : ""}" onclick="setMobileColumn('${column.id}')">${column.label} ${count(column.id)}</button>`).join("")}</div>
      <div class="mobile-list">${projectTickets.filter(candidate => candidate.column === state.mobileColumn).map(candidate => renderCard(candidate)).join("") || `<div class="empty-column">Nothing here.</div>`}</div>`;
  }
  const working = projectTickets.filter(candidate => candidate.agentState === "running").length;
  screen.innerHTML = `
    <div class="mobile-host-bar">Taro<span class="spacer"></span><span style="color:var(--text-faint)">✕</span></div>
    <div class="mobile-header">
      <div class="mobile-header-top">
        <button class="project-pill" onclick="openProjectSheet()"><span class="live-dot idle"></span><b>${projectName}</b><span style="color:var(--text-faint)">▾</span></button>
        ${elsewhere > 0 ? `<span style="color:var(--accent); font-size:12px">+${elsewhere} elsewhere</span>` : ""}
        <span class="spacer"></span>
        <button class="icon-button" title="Open manager in Paseo" onclick="toast('Opens the manager in Paseo')">↗</button>
        <button class="icon-button" title="Settings" onclick="openSettings()">⚙</button>
      </div>
      <div class="mobile-summary">${count("needs-you")} need you · ${count("stalled") ? `${count("stalled")} stalled · ` : ""}${working} working · ${count("queued")} queued · ${count("done")} done · manager ${PROJECTS[projectName].managerStatus}</div>
    </div>
    <div class="segment">
      <button class="${state.mobileTab === "manager" ? "active" : ""}" onclick="setMobileTab('manager')">Manager</button>
      <button class="${state.mobileTab === "inbox" ? "active" : ""}" onclick="setMobileTab('inbox')">Inbox ${attentionCount() ? `<span class="badge">${attentionCount()}</span>` : ""}</button>
      <button class="${state.mobileTab === "board" ? "active" : ""}" onclick="setMobileTab('board')">Board (${projectTickets.filter(candidate => candidate.column !== "done").length})</button>
    </div>
    <div class="mobile-body">${body}</div>`;
}

/* ---------- actions ---------- */
function render() { compact ? renderCompact() : renderDesktop(); }
function setTab(tab) { state.tab = tab; state.selectedTicketId = null; render(); }
function selectTicket(ticketId) { state.selectedTicketId = ticketId; state.conversationTab = "chat"; render(); }
function backToManager() { state.selectedTicketId = null; render(); }
function setConversationTab(tab) { state.conversationTab = tab; render(); }
function toggleChildren(ticketId) { state.expandedChildren.has(ticketId) ? state.expandedChildren.delete(ticketId) : state.expandedChildren.add(ticketId); render(); }
function setMobileTab(tab) { state.mobileTab = tab; render(); }
function setMobileColumn(column) { state.mobileColumn = column; render(); }
function openProjectSheet() { state.projectSheetOpen = true; render(); }
function closeProjectSheet() { state.projectSheetOpen = false; render(); }
function switchProject(projectName) { state.mobileProject = projectName; state.tab = projectName; state.projectSheetOpen = false; state.selectedTicketId = null; render(); }
function openSetup() { state.view = "setup"; render(); }
function openSettings() { if (!compact && state.tab === "inbox") state.tab = currentProject(); state.view = "settings"; render(); }
function closeSetup() { state.view = "screen"; render(); }
function setSetup(key, value) { state.setup[key] = value; render(); }
function saveSettings() { state.view = "screen"; toast("Saved. New task owners use the new settings."); render(); }
function createProject() {
  const candidate = AVAILABLE_PASEO_PROJECTS[state.setup.projectIndex];
  PROJECTS[candidate.name] = { prefix: prefixFor(candidate.name), managerStatus: "idle", managerModel: "Sonnet 5.5" };
  AVAILABLE_PASEO_PROJECTS.splice(state.setup.projectIndex, 1);
  state.setup.projectIndex = 0;
  state.view = "screen"; state.tab = candidate.name; state.mobileProject = candidate.name; state.mobileTab = "manager"; state.selectedTicketId = null;
  toast(`Created the ${candidate.name} tracker and started its manager`);
  render();
}
function toast(text) { const element = document.getElementById("toast"); element.textContent = text; element.style.display = "block"; clearTimeout(window.toastTimer); window.toastTimer = setTimeout(() => element.style.display = "none", 2600); }
function sendCommand(text) { toast(`Sent “${text}” to ${state.selectedTicketId ? state.selectedTicketId + "'s owner" : "the manager"}`); }
function act(ticketId, action) {
  const ticket = findTicket(ticketId);
  if (!ticket) { toast(`Sent “${action}”`); return; }
  if (action === "Accept") Object.assign(ticket, { column: "done", phase: "done", phaseLabel: "Done", agentState: null, call: null, milestone: "Accepted just now" });
  else if (action === "Approve plan") Object.assign(ticket, { column: "working", phase: "implementing", phaseLabel: "Implementing", agentState: "running", call: null, milestone: "Approval recorded · starting implementation" });
  else if (action === "Allow") Object.assign(ticket, { column: "working", agentState: "running", call: null, milestone: "Running docker compose up -d mongo redis" });
  else if (action === "Nudge") Object.assign(ticket, { column: "working", agentState: "running", stallReason: null, milestone: "Nudged · resuming go test" });
  toast(`${ticketId}: ${action}`);
  render();
}
render();
</script>
</body>
</html>
