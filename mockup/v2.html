<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taro plugin — UI mockup v2</title>
<style>
  :root {
    --background: #0e0e10; --surface: #151517; --surface-raised: #1b1b1e; --surface-hover: #222226;
    --border: #26262a; --text: #e6e6e9; --text-muted: #9a9aa2; --text-faint: #66666e;
    --green: #3fb950; --amber: #e3b341; --red: #f85149; --blue: #58a6ff; --violet: #a371f7; --cyan: #56d4dd;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--background); color: var(--text); font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; height: 100vh; overflow: hidden; }
  button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
  .app { display: grid; grid-template-columns: 200px 1fr; height: 100vh; }

  /* Paseo sidebar (host chrome, kept quiet) */
  .paseo-sidebar { background: var(--surface); border-right: 1px solid var(--border); padding: 12px 8px; display: flex; flex-direction: column; gap: 1px; }
  .paseo-brand { color: var(--text-faint); font-weight: 600; padding: 2px 8px 14px; }
  .sidebar-row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; color: var(--text-muted); width: 100%; text-align: left; }
  .sidebar-row:hover { background: var(--surface-hover); }
  .sidebar-row.active { background: var(--surface-raised); color: var(--text); }
  .sidebar-row .count { margin-left: auto; color: var(--amber); font-size: 12px; font-weight: 600; }
  .sidebar-section { font-size: 11px; color: var(--text-faint); padding: 16px 8px 4px; }

  /* Screen */
  .screen { display: flex; flex-direction: column; min-width: 0; }
  .screen-header { display: flex; align-items: center; gap: 2px; padding: 0 18px; height: 46px; border-bottom: 1px solid var(--border); }
  .tab { padding: 6px 12px; border-radius: 6px; color: var(--text-muted); display: flex; gap: 6px; align-items: center; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); background: var(--surface-raised); }
  .dot-count { color: var(--amber); font-size: 12px; font-weight: 600; }
  .spacer { flex: 1; }
  .icon-button { width: 28px; height: 28px; border-radius: 6px; color: var(--text-muted); display: inline-flex; align-items: center; justify-content: center; }
  .icon-button:hover { background: var(--surface-hover); color: var(--text); }
  .screen-body { flex: 1; display: grid; grid-template-columns: 1fr; min-height: 0; }
  .screen-body.with-conversation { grid-template-columns: 380px 1fr; }

  /* Conversation */
  .conversation { border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
  .conversation-header { padding: 12px 16px 0; display: flex; flex-direction: column; gap: 2px; }
  .conversation-header-top { display: flex; align-items: center; gap: 8px; }
  .back { color: var(--text-faint); font-size: 12px; }
  .back:hover { color: var(--blue); }
  .conversation-title { font-weight: 600; font-size: 14px; }
  .conversation-subtitle { color: var(--text-faint); font-size: 12px; }
  .segmented { display: flex; gap: 16px; border-bottom: 1px solid var(--border); margin-top: 10px; }
  .segmented button { padding: 6px 0; color: var(--text-faint); font-size: 12px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .segmented button.active { color: var(--text); border-color: var(--text); }
  .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .message { max-width: 90%; white-space: pre-wrap; }
  .message.user { align-self: flex-end; background: #1f2c40; padding: 8px 12px; border-radius: 12px; }
  .message.agent { align-self: flex-start; }
  .message.tool { color: var(--text-faint); font-family: ui-monospace, monospace; font-size: 11.5px; }
  .message.system { align-self: center; color: var(--text-faint); font-size: 11.5px; }
  .ask { border-left: 2px solid var(--amber); padding: 4px 0 4px 12px; display: flex; flex-direction: column; gap: 8px; }
  .ask-text { color: var(--amber); font-weight: 500; }
  .button-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .primary { background: var(--text); color: #111; font-weight: 600; border-radius: 6px; padding: 4px 12px; font-size: 12px; }
  .secondary { border: 1px solid var(--border); border-radius: 6px; padding: 3px 11px; font-size: 12px; color: var(--text-muted); }
  .secondary:hover { color: var(--text); border-color: #3a3a40; }
  .suggestions { padding: 0 16px 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  .suggestion { color: var(--text-muted); font-size: 12px; border: 1px solid var(--border); border-radius: 12px; padding: 2px 10px; }
  .suggestion:hover { color: var(--text); }
  .composer { margin: 0 16px 16px; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; color: var(--text-faint); }
  .ticket-detail { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 18px; }
  .detail-label { font-size: 11px; color: var(--text-faint); margin-bottom: 4px; }
  .detail-section ul { margin: 0; padding-left: 16px; color: var(--text-muted); }
  .timeline-row { display: flex; gap: 10px; font-size: 12px; color: var(--text-muted); padding: 2px 0; }
  .timeline-row span:first-child { color: var(--text-faint); width: 40px; flex: none; }

  /* Board */
  .board-area { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .board-toolbar { display: flex; align-items: center; gap: 10px; padding: 14px 20px 6px; }
  .board-title { font-weight: 600; font-size: 15px; }
  .board-subtitle { color: var(--text-faint); font-size: 12px; }
  .board { flex: 1; display: grid; grid-template-columns: repeat(3, minmax(220px, 1fr)); gap: 22px; padding: 12px 20px 20px; overflow: auto; align-items: start; }
  .lane-header { display: flex; align-items: baseline; gap: 6px; font-size: 12px; font-weight: 600; color: var(--text-muted); padding: 0 2px 8px; }
  .lane-header .lane-count { color: var(--text-faint); font-weight: 400; }
  .lane.needs-you .lane-header { color: var(--amber); }
  .lane-cards { display: flex; flex-direction: column; gap: 8px; }
  .sub-lane { margin-top: 22px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; }
  .card:hover { border-color: #34343a; }
  .card.selected { border-color: var(--blue); }
  .card-title { font-weight: 500; }
  .card-meta span { white-space: nowrap; }
  .card-meta { display: flex; gap: 8px; align-items: center; font-size: 11.5px; color: var(--text-faint); }
  .card-ask { font-size: 12px; color: var(--amber); }
  .card-ask.stalled { color: var(--red); }
  .card-actions { display: flex; gap: 8px; margin-top: 4px; }
  .phase { font-size: 11.5px; }
  .phase.planning { color: var(--violet); } .phase.implementing { color: var(--blue); } .phase.reviewing { color: var(--cyan); }
  .phase.awaiting { color: var(--amber); } .phase.blocked { color: var(--red); } .phase.done { color: var(--green); }
  .live-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; flex: none; }
  .live-dot.running { background: var(--green); animation: pulse 1.6s infinite; }
  .live-dot.idle { background: #4a4a52; } .live-dot.permission { background: var(--amber); } .live-dot.error { background: var(--red); }
  @keyframes pulse { 50% { opacity: .3; } }
  .children-pill { font-size: 11px; color: var(--text-faint); }
  .progress { height: 2px; background: var(--border); border-radius: 1px; overflow: hidden; margin-top: 4px; }
  .progress > div { height: 100%; background: var(--green); }

  .row { display: flex; align-items: center; gap: 8px; padding: 6px 4px; border-radius: 6px; font-size: 12.5px; color: var(--text-muted); cursor: pointer; }
  .row:hover { background: var(--surface); color: var(--text); }
  .row .row-id { color: var(--text-faint); font-size: 11.5px; width: 46px; flex: none; }
  .row .row-title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .row-note { color: var(--text-faint); font-size: 11.5px; }
  .more { color: var(--text-faint); font-size: 12px; padding: 4px; }
  .more:hover { color: var(--text); }

  /* Inbox */
  .inbox { flex: 1; overflow-y: auto; padding: 8px 20px 20px; max-width: 860px; }
  .inbox-item { display: flex; align-items: center; gap: 14px; padding: 12px 4px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .inbox-item:hover { background: var(--surface); }
  .inbox-item.selected { background: var(--surface-raised); }
  .inbox-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .inbox-top { display: flex; gap: 8px; font-size: 11.5px; color: var(--text-faint); }
  .project-chip { color: var(--text-muted); }
  .empty { color: var(--text-faint); padding: 24px 4px; }

  /* Paseo agent tab */
  .agent-tab { flex: 1; display: grid; grid-template-columns: 1fr 320px; min-height: 0; }
  .agent-transcript { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--border); }
  .side-panel { display: flex; flex-direction: column; min-height: 0; background: var(--surface); }
  .side-panel-header { padding: 12px 16px; border-bottom: 1px solid var(--border); font-weight: 600; font-size: 12px; color: var(--text-muted); }

  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--surface-raised); border: 1px solid var(--border); padding: 8px 14px; border-radius: 8px; z-index: 20; display: none; }
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; z-index: 30; }
  .modal { width: 440px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .modal textarea { background: var(--background); border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 10px; font: inherit; resize: none; }
  .version-switch { position: fixed; bottom: 14px; right: 16px; font-size: 11px; color: var(--text-faint); }
  .version-switch a { color: var(--text-muted); }
</style>
</head>
<body>
<div class="app">
  <aside class="paseo-sidebar" id="paseo-sidebar"></aside>
  <main class="screen" id="screen"></main>
</div>
<div class="toast" id="toast"></div>
<div class="modal-backdrop" id="modal-backdrop" onclick="if (event.target === this) closeModal()">
  <div class="modal">
    <div style="font-weight:600">New task in <span id="modal-project"></span></div>
    <textarea rows="4" placeholder="What should be done? You'll brainstorm the details with the task owner next."></textarea>
    <div class="button-row" style="justify-content:flex-end">
      <button class="secondary" onclick="closeModal()">Cancel</button>
      <button class="primary" onclick="createTask()">Create</button>
    </div>
  </div>
</div>
<div class="version-switch">v2 (rejected: too sparse) · <a href="index.html">v1 (chosen)</a></div>

<script>
const PROJECTS = {
  shop: { prefix: "SH", managerStatus: "idle" },
  "shop-api": { prefix: "SA", managerStatus: "idle" },
};

// lane: needs-you (incl. stalled) | working | queued | done
const TICKETS = [
  { id: "SH-012", project: "shop", title: "Hide SALE badge in product carousel on mobile", phase: "awaiting", phaseLabel: "Awaiting acceptance", agentState: "idle", pullRequest: "#381", milestone: "Review approved · PR ready", ask: "Accept the delivered result?", actions: ["Accept", "Request changes"], lane: "needs-you" },
  { id: "SH-015", project: "shop", title: "Retry failed refund pushes in payment worker", phase: "planning", phaseLabel: "Planning", agentState: "idle", milestone: "Plan written", ask: "Approve the plan?", actions: ["Approve plan"], lane: "needs-you" },
  { id: "SH-021", project: "shop", title: "Back off stock sync on supplier 429s", phase: "implementing", phaseLabel: "Implementing", agentState: "permission", milestone: "Integration test", ask: "Allow: docker compose up -d mongo redis", actions: ["Allow", "Deny"], lane: "needs-you" },
  { id: "SH-013", project: "shop", title: "Recompute totals after order backfill", phase: "implementing", phaseLabel: "Implementing", agentState: "idle", milestone: "Last: go test ./internal/totals", ask: "Stalled 42m — stopped without a reason", stalled: true, actions: ["Nudge"], lane: "needs-you" },
  { id: "SH-014", project: "shop", title: "Checkout with saved cards", phase: "reviewing", phaseLabel: "Reviewing", agentState: "running", pullRequest: "#377", milestone: "Reviewer running", lane: "working",
    children: [
      { id: "SH-016", title: "Card vault per provider", status: "Done" },
      { id: "SH-017", title: "3-D Secure callback", status: "Done" },
      { id: "SH-018", title: "Frontend checkout panel", status: "Reviewing" },
      { id: "SH-019", title: "Sandbox checks on 3 providers", status: "Ready" },
    ] },
  { id: "SH-022", project: "shop", title: "Product table sticky header on Safari", phase: "implementing", phaseLabel: "Implementing", agentState: "running", milestone: "Running Playwright spec", lane: "working" },
  { id: "SH-020", project: "shop", title: "Retry address verification on 5xx", note: "after SH-013", lane: "queued" },
  { id: "SH-023", project: "shop", title: "Search empty-result guard", note: "", lane: "queued" },
  { id: "SH-011", project: "shop", title: "Prefetch cart routes", note: "Oct 11", lane: "done" },
  { id: "SH-010", project: "shop", title: "Round discount to slider step", note: "Oct 10", lane: "done" },
  { id: "SH-009", project: "shop", title: "Pending shipments view", note: "Oct 8", lane: "done" },
  { id: "SH-008", project: "shop", title: "Custom currency picker", note: "Oct 6", lane: "done" },

  { id: "SA-004", project: "shop-api", title: "Product carousel price refresh", phase: "blocked", phaseLabel: "Blocked", agentState: "idle", milestone: "Needs SHIPPING_API_KEY", ask: "Blocked: needs an API key", actions: ["I added it"], lane: "needs-you" },
  { id: "SA-005", project: "shop-api", title: "Order list pagination", phase: "implementing", phaseLabel: "Implementing", agentState: "running", milestone: "Writing tests", lane: "working" },
  { id: "SA-001", project: "shop-api", title: "Hide SALE badge on mobile", note: "Oct 6", lane: "done" },
];

const SUGGESTIONS = {
  "manager:shop": ["Accept SH-012", "Nudge SH-013"],
  "manager:shop-api": ["Unblock SA-004"],
  "SH-012": ["Accept", "Ask for an iPhone SE screenshot"],
  "SH-015": ["Approve plan", "Cap retries at 3"],
  "SH-013": ["Resume where you stopped"],
};

function transcriptFor(key) {
  const transcripts = {
    "manager:shop": [
      { role: "user", text: "the order backfill should recompute affected totals, not just insert" },
      { role: "agent", text: "Filed SH-013 and started its owner. Click the card to brainstorm with it." },
      { role: "system", text: "SH-012 is ready for acceptance" },
    ],
    "manager:shop-api": [
      { role: "system", text: "SA-004 is blocked on a missing API key" },
    ],
    "SH-015": [
      { role: "user", text: "the worker should retry refund pushes that fail" },
      { role: "agent", text: "Retry forever, or give up and alert? And should a retry raise the timeout?" },
      { role: "user", text: "give up after a while and log it. longer timeout on retry" },
      { role: "tool", text: "read refunds.go, refund-worker.md" },
      { role: "agent", text: "Plan\n• Backoff, 5 attempts, then mark failed and log\n• Each retry raises the timeout 25%\n• Idempotent per (order, attempt)\n\nAcceptance criteria\n1. Transient failure succeeds on retry\n2. Permanent failure stops after 5 and is logged\n3. No double push per attempt" },
      { role: "ask", text: "Approve this plan?", options: ["Approve plan", "Request changes"] },
    ],
    "SH-012": [
      { role: "tool", text: "14 tests passed · reviewer approved a41c9e2" },
      { role: "agent", text: "PR #381 is ready. Mobile shows only the green dot; desktop is unchanged; the screen-reader label is kept." },
      { role: "ask", text: "Accept the delivered result?", options: ["Accept", "Request changes"] },
    ],
    "SH-021": [
      { role: "agent", text: "Adding jittered backoff to the supplier-stock call. The integration test needs local Mongo and Redis." },
      { role: "ask", text: "Allow: docker compose up -d mongo redis", options: ["Allow", "Deny"] },
    ],
    "SH-013": [
      { role: "tool", text: "go test ./internal/totals/... (13:02)" },
      { role: "system", text: "Idle since 13:05 — the turn ended without saying what it waits on" },
    ],
  };
  return transcripts[key] || [{ role: "agent", text: "Working on it — the latest milestone is on the ticket." }];
}

const state = { tab: "inbox", selectedTicketId: null, conversationTab: "chat", managerOpen: false, view: "screen", showAllDone: false, expandedChildren: new Set() };

const attentionCount = projectName => TICKETS.filter(ticket => ticket.lane === "needs-you" && (!projectName || ticket.project === projectName)).length;
const findTicket = ticketId => TICKETS.find(ticket => ticket.id === ticketId);

function renderSidebar() {
  const total = attentionCount();
  document.getElementById("paseo-sidebar").innerHTML = `
    <div class="paseo-brand">Paseo</div>
    <button class="sidebar-row ${state.view === "screen" ? "active" : ""}" onclick="openScreen()">Taro${total ? `<span class="count">${total}</span>` : ""}</button>
    <div class="sidebar-section">Projects</div>
    ${Object.keys(PROJECTS).map(projectName => `<div class="sidebar-row">${projectName}</div>`).join("")}
    <div class="sidebar-row" style="color:var(--text-faint)">shop-admin</div>`;
}

function liveDot(ticket) { return ticket.agentState ? `<span class="live-dot ${ticket.agentState}"></span>` : ""; }

function renderCard(ticket) {
  const selected = state.selectedTicketId === ticket.id ? "selected" : "";
  const childrenDone = ticket.children ? ticket.children.filter(child => child.status === "Done").length : 0;
  const expanded = state.expandedChildren.has(ticket.id);
  return `
  <div class="card ${selected}" onclick="selectTicket('${ticket.id}')">
    <div class="card-meta">${liveDot(ticket)}<span>${ticket.id}</span><span class="phase ${ticket.phase}">${ticket.phaseLabel}</span>${ticket.pullRequest ? `<span>PR ${ticket.pullRequest}</span>` : ""}</div>
    <div class="card-title">${ticket.title}</div>
    ${ticket.ask ? `<div class="card-ask ${ticket.stalled ? "stalled" : ""}">${ticket.ask}</div>
      <div class="card-actions" onclick="event.stopPropagation()"><button class="primary" onclick="act('${ticket.id}','${ticket.actions[0]}')">${ticket.actions[0]}</button><button class="secondary" onclick="selectTicket('${ticket.id}')">Reply</button></div>`
      : `<div class="card-meta">${ticket.milestone}</div>`}
    ${ticket.children ? `<div class="progress"><div style="width:${childrenDone / ticket.children.length * 100}%"></div></div>
      <button class="children-pill" onclick="event.stopPropagation(); toggleChildren('${ticket.id}')">${expanded ? "▾" : "▸"} ${childrenDone} of ${ticket.children.length} deliverables done</button>
      ${expanded ? ticket.children.map(child => `<div class="card-meta" style="padding-left:12px"><span class="phase ${child.status === "Done" ? "done" : "implementing"}">${child.status}</span>${child.title}</div>`).join("") : ""}` : ""}
  </div>`;
}

function renderRow(ticket) {
  return `<div class="row" onclick="selectTicket('${ticket.id}')"><span class="row-id">${ticket.id}</span><span class="row-title">${ticket.title}</span><span class="row-note">${ticket.note || ""}</span></div>`;
}

function renderBoard(projectName) {
  const tickets = TICKETS.filter(ticket => ticket.project === projectName);
  const lane = laneId => tickets.filter(ticket => ticket.lane === laneId);
  const done = lane("done");
  const visibleDone = state.showAllDone ? done : done.slice(0, 3);
  return `
  <div class="board-area">
    <div class="board-toolbar">
      <span class="board-title">${projectName}</span>
      <span class="spacer"></span>
      <button class="secondary" onclick="openManager()">Manager</button>
      <button class="secondary" onclick="sendCommand('Catch me up')">Catch up</button>
      <button class="primary" onclick="openModal()">New task</button>
    </div>
    <div class="board">
      <div class="lane needs-you">
        <div class="lane-header">Needs you <span class="lane-count">${lane("needs-you").length}</span></div>
        <div class="lane-cards">${lane("needs-you").map(renderCard).join("") || `<div class="empty">Nothing waiting on you.</div>`}</div>
      </div>
      <div class="lane">
        <div class="lane-header">Working <span class="lane-count">${lane("working").length}</span></div>
        <div class="lane-cards">${lane("working").map(renderCard).join("") || `<div class="empty">Idle.</div>`}</div>
      </div>
      <div class="lane">
        <div class="lane-header">Up next <span class="lane-count">${lane("queued").length}</span></div>
        <div>${lane("queued").map(renderRow).join("") || `<div class="empty">Nothing queued.</div>`}</div>
        <div class="sub-lane">
          <div class="lane-header">Done <span class="lane-count">${done.length}</span></div>
          <div>${visibleDone.map(renderRow).join("")}</div>
          ${done.length > 3 ? `<button class="more" onclick="toggleDone()">${state.showAllDone ? "Show less" : `Show ${done.length - 3} more`}</button>` : ""}
        </div>
      </div>
    </div>
  </div>`;
}

function renderInbox() {
  const items = TICKETS.filter(ticket => ticket.lane === "needs-you");
  return `
  <div class="board-area">
    <div class="board-toolbar"><span class="board-title">Needs you</span><span class="board-subtitle">across all projects</span></div>
    <div class="inbox">
      ${items.map(ticket => `
        <div class="inbox-item ${state.selectedTicketId === ticket.id ? "selected" : ""}" onclick="selectTicket('${ticket.id}')">
          <div class="inbox-main">
            <div class="inbox-top">${liveDot(ticket)}<span class="project-chip">${ticket.project}</span><span>${ticket.id}</span></div>
            <div class="card-title">${ticket.title}</div>
            <div class="card-ask ${ticket.stalled ? "stalled" : ""}">${ticket.ask}</div>
          </div>
          <div class="button-row" onclick="event.stopPropagation()"><button class="primary" onclick="act('${ticket.id}','${ticket.actions[0]}')">${ticket.actions[0]}</button><button class="secondary" onclick="selectTicket('${ticket.id}')">Reply</button></div>
        </div>`).join("") || `<div class="empty">You're all caught up.</div>`}
    </div>
  </div>`;
}

function renderMessages(key) {
  return transcriptFor(key).map(message => message.role === "ask"
    ? `<div class="ask"><div class="ask-text">${message.text}</div><div class="button-row">${message.options.map((option, index) => `<button class="${index ? "secondary" : "primary"}" onclick="act('${state.selectedTicketId}','${option}')">${option}</button>`).join("")}</div></div>`
    : `<div class="message ${message.role}">${message.text}</div>`).join("");
}

function renderTicketDetail(ticket) {
  return `<div class="ticket-detail">
    <div class="detail-section"><div class="detail-label">Acceptance criteria</div><ul><li>Requested behaviour on mobile</li><li>Desktop unchanged</li><li>Screen-reader label kept</li></ul></div>
    <div class="detail-section"><div class="detail-label">Approved</div><div style="color:var(--text-muted)">“yes go ahead” · Oct 12, 14:03</div></div>
    ${ticket.children ? `<div class="detail-section"><div class="detail-label">Deliverables</div>${ticket.children.map(child => `<div class="timeline-row"><span class="phase ${child.status === "Done" ? "done" : "implementing"}" style="width:70px">${child.status}</span><span>${child.title}</span></div>`).join("")}</div>` : ""}
    <div class="detail-section"><div class="detail-label">Delivery</div><div style="color:var(--text-muted)">${ticket.pullRequest ? `PR ${ticket.pullRequest} · reviewed at a41c9e2` : "No PR yet"}</div></div>
    <div class="detail-section"><div class="detail-label">Milestones</div>
      <div class="timeline-row"><span>14:10</span><span>Started implementation</span></div>
      <div class="timeline-row"><span>14:31</span><span>Tests green, committed</span></div>
      <div class="timeline-row"><span>14:48</span><span>${ticket.milestone || ticket.note || ""}</span></div>
    </div>
  </div>`;
}

function renderConversation() {
  const ticket = findTicket(state.selectedTicketId);
  const projectName = ticket ? ticket.project : state.tab;
  const key = ticket ? ticket.id : `manager:${projectName}`;
  const suggestions = SUGGESTIONS[key] || [];
  const header = ticket ? `
      <div class="conversation-header-top"><button class="back" onclick="openManager()">← ${projectName} manager</button><span class="spacer"></span>
        ${ticket.agentState ? `<button class="icon-button" title="Open in Paseo" onclick="openInPaseo('${ticket.id}')">↗</button>` : ""}
        <button class="icon-button" title="Close" onclick="closeConversation()">✕</button></div>
      <div class="conversation-title">${ticket.title}</div>
      <div class="conversation-subtitle">${ticket.id}${ticket.phaseLabel ? ` · ${ticket.phaseLabel}` : ""}</div>
      <div class="segmented"><button class="${state.conversationTab === "chat" ? "active" : ""}" onclick="setConversationTab('chat')">Chat</button><button class="${state.conversationTab === "ticket" ? "active" : ""}" onclick="setConversationTab('ticket')">Ticket</button></div>`
    : `
      <div class="conversation-header-top"><span class="conversation-title">${projectName} manager</span><span class="spacer"></span><button class="icon-button" title="Close" onclick="closeConversation()">✕</button></div>
      <div class="conversation-subtitle" style="padding-bottom:10px; border-bottom:1px solid var(--border)">Files tickets and starts task owners</div>`;
  const body = ticket && state.conversationTab === "ticket" ? renderTicketDetail(ticket) : `
      <div class="messages">${renderMessages(key)}</div>
      ${suggestions.length ? `<div class="suggestions">${suggestions.map(suggestion => `<button class="suggestion" onclick="sendCommand('${suggestion}')">${suggestion}</button>`).join("")}</div>` : ""}
      <div class="composer">Message…</div>`;
  return `<section class="conversation"><div class="conversation-header">${header}</div>${body}</section>`;
}

function renderAgentTab() {
  const ticket = findTicket(state.selectedTicketId);
  return `
    <div class="screen-header"><button class="back" onclick="openScreen()">← Taro</button><span style="margin-left:14px; color:var(--text-muted)">Paseo agent tab · ${ticket.id}</span></div>
    <div class="agent-tab">
      <div class="agent-transcript"><div class="messages">${renderMessages(ticket.id)}</div><div class="composer">Paseo's agent composer…</div></div>
      <div class="side-panel"><div class="side-panel-header">Taro · ${ticket.id}</div>${renderTicketDetail(ticket)}</div>
    </div>`;
}

function render() {
  renderSidebar();
  const screen = document.getElementById("screen");
  if (state.view === "agent-tab") { screen.innerHTML = renderAgentTab(); return; }
  const tabs = [["inbox", "Inbox", attentionCount()]].concat(Object.keys(PROJECTS).map(projectName => [projectName, projectName, attentionCount(projectName)]));
  const conversationVisible = state.selectedTicketId || state.managerOpen;
  screen.innerHTML = `
    <div class="screen-header">
      ${tabs.map(([tabId, label, count]) => `<button class="tab ${state.tab === tabId ? "active" : ""}" onclick="setTab('${tabId}')">${label}${count ? `<span class="dot-count">${count}</span>` : ""}</button>`).join("")}
      <button class="icon-button" title="Add project" onclick="toast('Add project: pick a Paseo project — creates its tracker and manager')">＋</button>
      <span class="spacer"></span>
      <button class="icon-button" title="Settings" onclick="toast('Settings: projects, models per role')">⚙</button>
    </div>
    <div class="screen-body ${conversationVisible ? "with-conversation" : ""}">
      ${conversationVisible ? renderConversation() : ""}
      ${state.tab === "inbox" ? renderInbox() : renderBoard(state.tab)}
    </div>`;
}

function setTab(tab) { state.tab = tab; state.selectedTicketId = null; state.managerOpen = false; render(); }
function selectTicket(ticketId) { state.selectedTicketId = ticketId; state.conversationTab = "chat"; render(); }
function openManager() { if (state.tab === "inbox") state.tab = findTicket(state.selectedTicketId)?.project || "shop"; state.selectedTicketId = null; state.managerOpen = true; render(); }
function closeConversation() { state.selectedTicketId = null; state.managerOpen = false; render(); }
function setConversationTab(tab) { state.conversationTab = tab; render(); }
function toggleChildren(ticketId) { state.expandedChildren.has(ticketId) ? state.expandedChildren.delete(ticketId) : state.expandedChildren.add(ticketId); render(); }
function toggleDone() { state.showAllDone = !state.showAllDone; render(); }
function openInPaseo(ticketId) { state.selectedTicketId = ticketId; state.view = "agent-tab"; render(); }
function openScreen() { state.view = "screen"; render(); }
function openModal() { document.getElementById("modal-project").textContent = state.tab; document.getElementById("modal-backdrop").style.display = "flex"; }
function closeModal() { document.getElementById("modal-backdrop").style.display = "none"; }
function createTask() {
  closeModal();
  const ticket = { id: `${PROJECTS[state.tab].prefix}-024`, project: state.tab, title: "New task", phase: "planning", phaseLabel: "Planning", agentState: "running", milestone: "Reading the repository", lane: "working" };
  TICKETS.push(ticket);
  state.selectedTicketId = ticket.id;
  toast(`${ticket.id} created — brainstorm with its owner here`);
  render();
}
function toast(text) { const element = document.getElementById("toast"); element.textContent = text; element.style.display = "block"; clearTimeout(window.toastTimer); window.toastTimer = setTimeout(() => element.style.display = "none", 2400); }
function sendCommand(text) { toast(`Sent “${text}”`); }
function act(ticketId, action) {
  const ticket = findTicket(ticketId);
  if (!ticket) return;
  const updates = {
    "Accept": { lane: "done", note: "just now", agentState: null, ask: null },
    "Approve plan": { lane: "working", phase: "implementing", phaseLabel: "Implementing", agentState: "running", ask: null, milestone: "Starting implementation" },
    "Allow": { lane: "working", agentState: "running", ask: null, milestone: "Starting Mongo + Redis" },
    "Nudge": { lane: "working", agentState: "running", ask: null, stalled: false, milestone: "Resuming tests" },
    "I added it": { lane: "working", phase: "implementing", phaseLabel: "Implementing", agentState: "running", ask: null, milestone: "Resuming" },
  }[action];
  if (updates) Object.assign(ticket, updates);
  toast(updates ? `${ticketId}: ${action}` : `Sent “${action}” to ${ticketId}`);
  if (state.view === "agent-tab" && !ticket.agentState) state.view = "screen";
  render();
}
render();
</script>
</body>
</html>
