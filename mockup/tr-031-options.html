<!doctype html>
<!-- TR-031: every board card state, today's card beside the proposed one, plus the tab bar's new-project
     control. Invented data only. ?frame=cards&width=<card width> | ?frame=tabs&width=<page width>;
     mockup/tr-031-shots.cjs renders them. -->
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#161616; --s0:#1c1c1c; --s1:#222; --s2:#2c2c2c; --b:#333; --fg:#ececec; --mu:#9a9a9a;
          --ac:#e0855a; --warn:#d6a35c; --ok:#5fb87a; --bad:#e06c6c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.5 -apple-system, "Segoe UI", Inter, sans-serif; padding:16px; }
  h1 { font-size:15px; margin:0 0 4px; } .sub { color:var(--mu); font-size:12px; margin-bottom:14px; max-width:900px; }
  .grid { display:grid; gap:14px 18px; align-items:start; }
  .lbl { color:var(--mu); font-size:11px; font-weight:700; letter-spacing:.6px; text-transform:uppercase; padding-top:8px; }
  .colhead { color:var(--mu); font-size:11px; font-weight:700; letter-spacing:.6px; text-transform:uppercase; }
  .card { border:1px solid var(--b); border-radius:10px; padding:14px; background:var(--s0); display:flex; flex-direction:column; gap:8px; }
  .hd { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .id { color:var(--mu); font-size:12px; font-weight:600; flex:1 0 auto; }
  .dot { width:8px; height:8px; border-radius:4px; }
  .badge { display:inline-flex; gap:4px; align-items:center; border:1px solid; border-radius:6px; padding:1px 8px; font-size:12px; font-weight:600; white-space:nowrap; }
  .t { font-weight:600; font-size:14px; line-height:21px; }
  .i { width:13px; height:13px; display:inline-block; flex:none; }
  svg { stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  /* today */
  .old .line { display:flex; gap:8px; align-items:flex-start; font-size:13px; line-height:20px; }
  .old .line .tx { flex:1; min-width:0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .old .go { color:var(--ac); font-size:12px; font-weight:600; white-space:nowrap; }
  /* proposed */
  .now { display:grid; grid-template-columns:16px 1fr; column-gap:8px; row-gap:2px; }
  .now .ic { grid-row:1; padding-top:3px; }
  .now .head { font-size:13px; line-height:20px; }
  .now .detail { grid-column:2; font-size:12px; line-height:18px; color:var(--mu); }
  .now .act { grid-column:2; margin-top:4px; }
  .act a { color:var(--ac); font-size:12px; font-weight:600; text-decoration:none; display:inline-flex; gap:4px; align-items:center; border:1px solid #e0855a55; border-radius:6px; padding:2px 8px; }
  .foot { display:flex; gap:8px; align-items:center; flex-wrap:wrap; color:var(--mu); font-size:12px; border-top:1px solid var(--b); padding-top:8px; }
  .btn { border:1px solid var(--b); background:var(--s1); color:var(--fg); border-radius:7px; padding:2px 8px; font-size:12px; display:inline-flex; gap:5px; align-items:center; }
  .kids { display:flex; gap:8px; align-items:center; color:var(--mu); font-size:12px; }
  .track { width:44px; height:3px; border-radius:2px; background:var(--s2); overflow:hidden; display:inline-block; }
  .track i { display:block; height:3px; background:var(--ok); }
  .kid { display:flex; gap:8px; align-items:center; padding-left:20px; color:var(--mu); font-size:12px; }
  .link { color:var(--ac); }
  /* tabs */
  .tabs { display:flex; align-items:center; gap:16px; border-bottom:1px solid var(--b); padding:0 16px; background:var(--s0); }
  .tab { display:flex; gap:8px; align-items:center; padding:12px 4px 10px; border-bottom:2px solid transparent; color:var(--mu); font-size:14px; font-weight:500; }
  .tab.on { color:var(--fg); font-weight:600; border-bottom-color:var(--ac); }
  .newp { margin-left:auto; display:flex; gap:6px; align-items:center; border:1px solid var(--b); border-radius:7px; padding:3px 10px; color:var(--fg); font-size:12px; font-weight:600; background:var(--s1); }
  .newp.round { padding:4px; border-radius:14px; }
  .sep { width:1px; align-self:stretch; background:var(--b); margin:10px 0; }
  .pane { border:1px solid var(--b); border-top:none; padding:12px 16px; color:var(--fg); font-weight:600; font-size:16px; background:var(--s0); }
</style>
</head>
<body>
<div id="root"></div>
<script>
const q = new URLSearchParams(location.search);
const frame = q.get("frame") || "cards";
const width = Number(q.get("width") || 280);
const C = { ac:"var(--ac)", ok:"var(--ok)", warn:"var(--warn)", bad:"var(--bad)", mu:"var(--mu)", fg:"var(--fg)" };
// Lucide paths, enough for the mockup.
const ICONS = {
  Hand:'<path d="M18 11V6a2 2 0 0 0-4 0v5M14 10V4a2 2 0 0 0-4 0v6M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/>',
  PackageCheck:'<path d="m16 16 2 2 4-4"/><path d="M21 10V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l2-1.14"/>',
  PackageX:'<path d="M21 10V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l2-1.14"/><path d="m17 13 5 5m-5 0 5-5"/>',
  KeyRound:'<circle cx="16.5" cy="7.5" r="2.5"/><path d="M2 18v3h4l9.6-9.6A6 6 0 1 0 12 7.5"/>',
  CircleAlert:'<circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>',
  Hourglass:'<path d="M5 22h14M5 2h14M17 22v-4.17a2 2 0 0 0-.59-1.42L12 12l-4.41 4.41A2 2 0 0 0 7 17.83V22M7 2v4.17a2 2 0 0 0 .59 1.42L12 12l4.41-4.41A2 2 0 0 0 17 6.17V2"/>',
  Loader:'<path d="M12 2v4M16.2 7.8l2.9-2.9M18 12h4M16.2 16.2l2.9 2.9M12 18v4M4.9 19.1l2.9-2.9M2 12h4M4.9 4.9l2.9 2.9"/>',
  Clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  GitMerge:'<circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M6 21V9a9 9 0 0 0 9 9"/>',
  Monitor:'<rect width="20" height="14" x="2" y="3" rx="2"/><path d="M8 21h8M12 17v4"/>',
  Timer:'<path d="M10 2h4M12 14l3-3"/><circle cx="12" cy="14" r="8"/>',
  ChevronRight:'<path d="m9 18 6-6-6-6"/>', ChevronDown:'<path d="m6 9 6 6 6-6"/>',
  ArrowRight:'<path d="M5 12h14M12 5l7 7-7 7"/>', Plus:'<path d="M5 12h14M12 5v14"/>',
  Zap:'<path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>',
  RotateCcw:'<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>',
  Inbox:'<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
  Folder:'<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',
};
const icon = (name, color, size = 13) => `<svg class="i" style="color:${color};width:${size}px;height:${size}px" viewBox="0 0 24 24">${ICONS[name]}</svg>`;
const PHASE = { Backlog:[C.mu,"Clock"], Planning:[C.ac,"Loader"], "In Progress":[C.ac,"Loader"], Reviewing:[C.ac,"Loader"], "Awaiting acceptance":[C.warn,"Hourglass"], Done:[C.ok,"PackageCheck"] };
const badge = (status) => { const [c, i] = PHASE[status]; return `<span class="badge" style="color:${c};border-color:color-mix(in srgb, ${c} 45%, transparent);background:color-mix(in srgb, ${c} 12%, transparent)">${icon(i, c, 12)}${status}</span>`; };
const head = (s) => `<div class="hd"><span class="dot" style="background:${s.dot}"></span><span class="id">${s.id}${s.parent ? `  ↳ ${s.parent}` : ""}</span>${badge(s.status)}</div>`;

// Each state: today's single line (old) and the proposed headline / detail / action (now).
const STATES = [
  { name:"Queued", id:"NB-14", status:"Backlog", dot:C.mu, title:"Export notes as Markdown", foot:"low",
    old:null, now:null },
  { name:"Planning", id:"NB-15", status:"Planning", dot:C.ok, title:"Tag colours in the sidebar", foot:"medium · context 42k",
    old:{ i:"Loader", c:C.mu, t:"waiting: reading the sidebar and theme code · 2 min ago" },
    now:{ i:"Loader", c:C.mu, h:"Reading the sidebar and theme code", d:"Working · 2 min ago" } },
  { name:"Working, subagent", id:"NB-16", status:"In Progress", dot:C.ok, title:"Sync notes between devices", foot:"high · context 88k · 1 subagent",
    old:{ i:"Hourglass", c:C.ok, t:"Waiting on implementer NB-16.02 · 6 min", fg:true },
    now:{ i:"Hourglass", c:C.ok, h:"Waiting on implementer NB-16.02", d:"Conflict resolution · running 6 min", fg:true } },
  { name:"Question", id:"NB-17", status:"Planning", dot:C.mu, title:"Search across archived notes", foot:"medium · context 31k",
    old:{ i:"Hand", c:C.warn, t:"Should archived notes appear in search by default, or only behind a toggle in the search bar?", more:2, go:"Answer" },
    now:{ i:"Hand", c:C.warn, h:"Should archived notes appear in search by default, or only behind a toggle in the search bar?", d:"Blocking · 2 more questions", act:"Answer" } },
  { name:"Permission", id:"NB-18", status:"In Progress", dot:C.warn, title:"Faster startup on large libraries", foot:"low · context 54k",
    old:{ i:"KeyRound", c:C.warn, t:"Waiting on a permission", go:"Allow…" },
    now:{ i:"KeyRound", c:C.warn, h:"Waiting on a permission", act:"Allow" } },
  { name:"Stalled", id:"NB-19", status:"In Progress", dot:C.mu, title:"Offline mode for the editor", foot:"medium · context 120k", stalled:true,
    old:{ i:"CircleAlert", c:C.bad, t:"Still idle after a nudge: tests half written · 25 min ago", bad:true },
    now:{ i:"CircleAlert", c:C.bad, h:"Still idle after a nudge", d:"Last said: tests half written · 25 min ago", bad:true } },
  { name:"Crashed", id:"NB-20", status:"Reviewing", dot:C.bad, title:"Keyboard shortcuts sheet", foot:"low", stalled:true, crashed:true,
    old:{ i:"CircleAlert", c:C.bad, t:"Crashed twice within an hour; the plugin stopped restarting it · 3 min ago", bad:true },
    now:{ i:"CircleAlert", c:C.bad, h:"Crashed twice within an hour", d:"Not restarted again · 3 min ago", bad:true } },
  { name:"Awaiting, complete", id:"NB-21", status:"Awaiting acceptance", dot:C.mu, title:"Pin notes to the top of a folder", foot:"low · context 170k · PR #42",
    old:{ i:"PackageCheck", c:C.ac, t:"Ready to accept · 3 checks · review · 4 screenshots", go:"Review" },
    now:{ i:"PackageCheck", c:C.ac, h:"Ready to accept", d:"3 checks · review · 4 screenshots", act:"Review" } },
  { name:"Awaiting, incomplete", id:"NB-22", status:"Awaiting acceptance", dot:C.mu, title:"Rename folders inline", foot:"low · context 64k",
    old:{ i:"PackageX", c:C.warn, t:"Not ready to accept · Evidence missing: the review outcome, screenshot file rename-phone.png", go:"Review" },
    now:{ i:"PackageX", c:C.warn, h:"Not ready to accept", d:"Missing: the review outcome, screenshot file rename-phone.png", act:"Review" } },
  { name:"Accepted, merging", id:"NB-23", status:"Awaiting acceptance", dot:C.ok, title:"Word count in the status bar", foot:"trivial · context 40k",
    old:{ i:"PackageCheck", c:C.ac, t:"Ready to accept · 1 check · review · 2 screenshots", go:"Review" },
    now:{ i:"GitMerge", c:C.ok, h:"Accepted · merging into main", d:"Since 1 min ago", fg:true } },
  { name:"Parent", id:"NB-24", status:"In Progress", dot:C.ok, title:"Shared notebooks", foot:"high · context 96k · 1 subagent", kids:[2,4],
    old:{ i:"Hourglass", c:C.ok, t:"Waiting on implementer NB-24.03 · 12 min", fg:true },
    now:{ i:"Hourglass", c:C.ok, h:"Waiting on implementer NB-24.03", d:"Invite links · running 12 min", fg:true } },
  { name:"Child", id:"NB-24.03", parent:"NB-24", status:"In Progress", dot:C.ok, title:"Invite links", foot:"medium · 1 subagent",
    old:{ i:"Hourglass", c:C.ok, t:"Waiting on implementer NB-24.03 · 12 min", fg:true },
    now:{ i:"Hourglass", c:C.ok, h:"Implementer building it", d:"Running 12 min", fg:true } },
  { name:"Done", id:"NB-09", status:"Done", dot:C.mu, title:"Dark theme for the editor", done:true },
  { name:"Owner elsewhere", id:"NB-25", status:"In Progress", dot:C.mu, title:"Print a note", foot:"low · on laptop-b",
    old:{ i:"Loader", c:C.mu, t:"working: layout for A4 · 1 h ago" },
    now:{ i:"Monitor", c:C.mu, h:"Owner runs on laptop-b", d:"Last said: layout for A4 · 1 h ago" } },
];

function oldCard(s) {
  let body = head(s) + `<div class="t">${s.title}</div>`;
  if (s.done) return `<div class="card old">${body}${statsLine()}</div>`;
  if (s.old) {
    const o = s.old;
    body += `<div class="line"><span style="padding-top:3px">${icon(o.i, o.c)}</span><span class="tx" style="color:${o.bad ? C.bad : o.fg ? C.fg : o.go ? C.fg : C.mu};${o.bad ? "font-weight:600" : ""}">${o.t}</span>${o.more ? `<span style="color:${C.mu};font-size:12px">+${o.more}</span>` : ""}${o.go ? `<span class="go">${o.go} →</span>` : ""}</div>`;
  }
  body += kids(s, false);
  body += footer(s, false);
  return `<div class="card old">${body}</div>`;
}

function newCard(s) {
  let body = head(s) + `<div class="t">${s.title}</div>`;
  if (s.done) return `<div class="card">${body}${statsLine()}</div>`;
  if (s.now) {
    const n = s.now;
    body += `<div class="now"><span class="ic">${icon(n.i, n.c)}</span><span class="head" style="color:${n.bad ? C.bad : n.fg || n.act ? C.fg : C.mu};${n.bad || n.act ? "font-weight:600" : ""}">${n.h}</span>` +
      (n.d ? `<span class="detail">${n.d}</span>` : "") +
      (n.act ? `<span class="act"><a>${n.act} ${icon("ArrowRight", C.ac, 12)}</a></span>` : "") +
      (s.stalled ? `<span class="act" style="display:flex;gap:6px">${s.crashed ? "" : `<span class="btn">${icon("Zap", C.fg, 12)} Nudge</span>`}<span class="btn">${icon("RotateCcw", C.fg, 12)} Relaunch</span></span>` : "") + `</div>`;
  }
  body += kids(s, true);
  body += footer(s, true);
  return `<div class="card">${body}</div>`;
}

const statsLine = () => `<div class="kids">${icon("Timer", C.mu, 12)} 2 h 10 min wall · 48 min active · 31 turns · $3.40</div>`;
function kids(s, open) {
  if (!s.kids) return "";
  const [done, total] = s.kids;
  let out = `<div class="kids">${icon(open ? "ChevronDown" : "ChevronRight", C.mu, 12)}<span class="track"><i style="width:${(done / total) * 100}%"></i></span>${done}/${total} children done</div>`;
  if (open) out += [["Done","NB-24.01 · Notebook model"],["Done","NB-24.02 · Sharing settings"],["In Progress","NB-24.03 · Invite links"],["Backlog","NB-24.04 · Revoke access"]].map(([st, t]) => `<div class="kid">${badge(st)}<span>${t}</span></div>`).join("");
  return out;
}
function footer(s, proposed) {
  const buttons = s.stalled ? (s.crashed ? "" : `<span class="btn">${icon("Zap", C.fg, 12)} Nudge</span>`) + `<span class="btn">${icon("RotateCcw", C.fg, 12)} Relaunch</span>` : "";
  let text = s.foot;
  if (proposed && text) text = text.replace(" · on laptop-b", "").replace(" · PR #42", ` · <span class="link">PR #42</span>`);
  return `<div class="foot">${proposed ? `<span>${text}</span>` : `${buttons}<span>${text}</span>`}</div>`;
}

const root = document.getElementById("root");
if (frame === "cards") {
  const half = q.get("half");
  const states = half === "1" ? STATES.slice(0, 7) : half === "2" ? STATES.slice(7) : STATES;
  root.innerHTML = `<h1>TR-031 · board cards, every state</h1><div class="sub">Card width ${width}px. Left: today. Right: proposed — icon in a fixed column; a headline that wraps (never cut mid-fact); a muted detail line under it; the action as a small button on its own line under the text.</div>` +
    `<div class="grid" style="grid-template-columns:120px ${width}px ${width}px"><div></div><div class="colhead">Today</div><div class="colhead">Proposed</div>` +
    states.map((s) => `<div class="lbl">${s.name}</div>${oldCard(s)}${newCard(s)}`).join("") + `</div>`;
} else {
  const phone = width < 600;
  const tabsOld = phone
    ? `<div class="tabs"><span class="tab on">${icon("Folder", C.fg, 15)}notes</span><span class="tab">${icon("Folder", C.mu, 15)}site</span><span class="tab">${icon("Plus", C.mu, 15)}</span></div>`
    : `<div class="tabs"><span class="tab">${icon("Inbox", C.mu, 15)}Inbox</span><span class="tab on">${icon("Folder", C.fg, 15)}notes</span><span class="tab">${icon("Folder", C.mu, 15)}site</span><span class="tab">${icon("Plus", C.mu, 15)}project</span></div>`;
  const tabsNew = phone
    ? `<div class="tabs"><span class="tab on">${icon("Folder", C.fg, 15)}notes</span><span class="tab">${icon("Folder", C.mu, 15)}site</span><span class="newp round" title="New project">${icon("Plus", C.fg, 15)}</span></div>`
    : `<div class="tabs"><span class="tab">${icon("Inbox", C.mu, 15)}Inbox</span><span class="tab on">${icon("Folder", C.fg, 15)}notes</span><span class="tab">${icon("Folder", C.mu, 15)}site</span><span class="newp">${icon("Plus", C.fg, 13)}New project</span></div>`;
  root.innerHTML = `<h1>TR-031 · tab bar and Manager title</h1><div class="sub">Today, then proposed: “+ project” becomes a small outlined “New project” button at the bar's right end (a round + on a phone), apart from the project tabs.</div>` +
    `<div class="colhead" style="margin:10px 0 4px">Today</div>${tabsOld}<div class="pane">notes · manager</div>` +
    `<div class="colhead" style="margin:18px 0 4px">Proposed</div>${tabsNew}<div class="pane">notes · Manager</div>`;
}
</script>
</body>
</html>
