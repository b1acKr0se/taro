<!doctype html>
<!-- TR-030 options: a decision card whose options survive long text, many options and phone width.
     Invented content only. Open with ?design=now|a|b|c&width=<pane width>;
     mockup/tr-030-shots.cjs renders every frame. -->
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#161616; --s0:#1b1b1b; --s1:#222; --s2:#2a2a2a; --b:#353535; --fg:#ececec; --mu:#9a9a9a;
          --ac:#5fb87a; --acs:#5fb87a22; --warn:#d6a35c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.5 -apple-system, "Segoe UI", Inter, sans-serif; }
  .pane { margin:0 auto; padding:16px; display:flex; flex-direction:column; gap:14px; }
  .caption { color:var(--mu); font-size:12px; }
  .caption b { color:var(--fg); }
  .msg { color:var(--fg); font-size:14px; line-height:21px; }
  .card { border:1px solid var(--b); border-radius:10px; padding:12px; background:var(--s1); display:flex; flex-direction:column; gap:8px; }
  .card.wait { border-color:var(--warn); }
  .blocking { color:var(--warn); font-size:11px; font-weight:700; letter-spacing:.5px; }
  .q { font-size:14px; font-weight:600; line-height:21px; }
  .why { color:var(--mu); font-size:13px; line-height:20px; white-space:pre-line; }
  .why.fold { display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; }
  .more { color:var(--ac); font-size:12px; margin-top:-4px; }
  .label { font-size:13px; font-weight:600; }
  .cons { color:var(--mu); font-size:12px; line-height:18px; }
  .reason { color:var(--mu); font-size:12px; font-style:italic; }
  .note { color:var(--mu); font-size:12px; }
  .answer { display:flex; gap:6px; align-items:flex-end; }
  .input { flex:1; min-height:34px; border:1px solid var(--b); border-radius:8px; padding:6px 10px; background:var(--s0); color:var(--mu); font-size:13px; }
  .send { width:30px; height:30px; border:1px solid var(--b); border-radius:8px; display:flex; align-items:center; justify-content:center; color:var(--mu); }
  .chip { color:var(--ac); font-size:11px; font-weight:600; }
  .pill { display:inline-block; border:1px solid var(--ac); color:var(--ac); border-radius:5px; padding:0 6px; font-size:10px; font-weight:700; letter-spacing:.4px; white-space:nowrap; }

  /* now: today's card, options side by side */
  .now-opts { display:flex; flex-wrap:wrap; gap:6px; }
  .now-opt { border:1px solid var(--b); border-radius:8px; padding:6px 10px; max-width:100%; }
  .now-opt.rec { border-color:var(--ac); background:var(--s2); }

  /* a: stacked rows, one per option */
  .rows { display:flex; flex-direction:column; gap:6px; }
  .row { display:flex; gap:10px; align-items:center; border:1px solid var(--b); border-radius:8px; padding:8px 10px; background:var(--s0); }
  .row.rec { border-color:var(--ac); background:var(--acs); }
  .row .body { flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
  .row .head { display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; }
  .row .arrow { color:var(--mu); font-size:15px; }
  .row.rec .arrow { color:var(--ac); }
  .row .why-rec { color:var(--fg); font-size:12px; opacity:.8; }

  /* b: read the options as a list, then press a short button */
  .list { margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:6px; }
  .list li { display:flex; gap:8px; }
  .list .n { color:var(--mu); font-size:12px; width:16px; flex:none; padding-top:1px; }
  .list .t { flex:1; min-width:0; }
  .list .t .cons { display:inline; }
  .list .rec-line { color:var(--ac); font-size:12px; }
  .buttons { display:flex; flex-wrap:wrap; gap:6px; }
  .btn { border:1px solid var(--b); border-radius:8px; padding:5px 10px; font-size:13px; font-weight:600; background:var(--s0); max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .btn.rec { border-color:var(--ac); background:var(--ac); color:#0f1f14; }
  .btn .num { color:var(--mu); font-weight:400; margin-right:4px; }
  .btn.rec .num { color:#0f1f14aa; }

  /* c: the recommendation first, the others below */
  .pick { border:1px solid var(--ac); border-radius:8px; padding:10px; background:var(--acs); display:flex; flex-direction:column; gap:6px; }
  .pick .go { align-self:flex-start; border-radius:8px; padding:5px 12px; background:var(--ac); color:#0f1f14; font-weight:700; font-size:13px; max-width:100%; }
  .others-h { color:var(--mu); font-size:11px; font-weight:700; letter-spacing:.5px; margin-top:2px; }
  .other { display:flex; gap:10px; align-items:center; border-top:1px solid var(--b); padding:7px 2px; }
  .other:last-of-type { border-bottom:1px solid var(--b); }
  .other .body { flex:1; min-width:0; }
  .other .arrow { color:var(--mu); }
</style>
</head>
<body>
<div class="pane" id="pane"></div>
<script>
const cases = [
  {
    caption: "1 · Two short options, non-blocking",
    message: "The list view is in. One small call before I wire up sorting:",
    question: "Sort notes by date or by title?",
    why: "Date keeps the latest work on top; title makes a long list easier to scan by name",
    blocking: false,
    options: [
      { label: "By date", consequence: "most recent notes appear first" },
      { label: "By title", consequence: "notes appear alphabetically" },
    ],
    recommended: "By date",
    reason: "most note-taking use is returning to recent work",
    default: "By date",
  },
  {
    caption: "2 · Four options with long consequences, blocking",
    message: "Export works end to end. Before I build the settings page I need one answer from you:",
    question: "Where should exported notebooks be saved by default?",
    why: "Exports can be large and people run them on a schedule, so the default decides whether they ever need to look at a dialog.",
    blocking: true,
    options: [
      { label: "Next to the original notebook", consequence: "exports sit beside their source and are easy to find, but a shared notebook folder fills up with files nobody else asked for, and those files sync to every member's devices" },
      { label: "One Exports folder in the home directory", consequence: "a single predictable place that never touches shared folders; people with several notebooks of the same name get numbered copies such as Recipes (2).zip" },
      { label: "Ask every time with a save dialog", consequence: "full control for each export at the cost of an extra step, and scheduled exports can no longer run unattended" },
      { label: "Somewhere else…", consequence: "you name the folder" },
    ],
    recommended: "One Exports folder in the home directory",
    reason: "it keeps shared folders clean and still works for scheduled exports",
    default: "",
  },
  {
    caption: "3 · A long, multi-paragraph why",
    message: "I found older notebooks that still use the version 1 attachment format.",
    question: "Keep reading the old attachment format?",
    why: "About one notebook in twenty still stores attachments in the version 1 format, which keeps images inline as text instead of as separate files.\n\nReading it needs a second parser that has had two crash reports this year, both from very large images. Converting on open fixes the notebook for good, but an older copy of the app on another device then cannot open it.\n\nDropping support is the simplest code, but anyone who skipped the last three releases would see blank attachments until they convert with the command-line tool.",
    blocking: false,
    options: [
      { label: "Keep reading it", consequence: "nothing changes for anyone; the second parser stays" },
      { label: "Convert on open", consequence: "one-way upgrade; older app versions cannot open converted notebooks" },
      { label: "Drop support", consequence: "simplest; old notebooks show blank attachments until converted" },
    ],
    recommended: "Convert on open",
    reason: "it removes the parser for good and older versions are rare now",
    default: "Convert on open",
  },
];

const params = new URLSearchParams(location.search);
const design = params.get("design") || "a";
const width = Number(params.get("width") || 820);
document.getElementById("pane").style.maxWidth = width + "px";
const phone = width < 500;

const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
const isRec = (c, o) => o.label === c.recommended;
const answer = () => `<div class="answer"><div class="input">Answer in your own words…</div><div class="send">➤</div></div>`;
const why = c => {
  const long = c.why.length > 220;
  return `<div class="why ${long ? "fold" : ""}">${esc(c.why)}</div>${long ? `<div class="more">Show all</div>` : ""}`;
};
const head = c => `${c.blocking ? `<div class="blocking">WAITING FOR YOU</div>` : ""}<div class="q">${esc(c.question)}</div>${why(c)}`;
const defaultNote = c => !c.blocking && c.default ? `<div class="note">Going with “${esc(c.default)}” unless you say otherwise.</div>` : "";

const designs = {
  now: c => `${head(c)}
    <div class="now-opts">${c.options.map(o => `<div class="now-opt ${isRec(c, o) ? "rec" : ""}">
      ${isRec(c, o) ? `<div class="chip">RECOMMENDED</div>` : ""}<div class="label">${esc(o.label)}</div><div class="cons">${esc(o.consequence)}</div></div>`).join("")}</div>
    <div class="reason">Why recommended: ${esc(c.reason)}</div>${defaultNote(c)}${answer()}`,

  a: c => `${head(c)}
    <div class="rows">${c.options.map(o => `<div class="row ${isRec(c, o) ? "rec" : ""}">
      <div class="body">
        <div class="head"><span class="label">${esc(o.label)}</span>${isRec(c, o) ? `<span class="pill">RECOMMENDED</span>` : ""}</div>
        <div class="cons">${esc(o.consequence)}</div>
        ${isRec(c, o) ? `<div class="why-rec">Why: ${esc(c.reason)}</div>` : ""}
      </div><div class="arrow">›</div></div>`).join("")}</div>
    ${defaultNote(c)}${answer()}`,

  b: c => `${head(c)}
    <ol class="list">${c.options.map((o, i) => `<li><span class="n">${i + 1}.</span><div class="t">
      <span class="label">${esc(o.label)}</span> <span class="cons">— ${esc(o.consequence)}</span>
      ${isRec(c, o) ? `<div class="rec-line">★ Recommended: ${esc(c.reason)}</div>` : ""}</div></li>`).join("")}</ol>
    <div class="buttons">${c.options.map((o, i) => `<div class="btn ${isRec(c, o) ? "rec" : ""}"><span class="num">${i + 1}</span>${esc(o.label)}</div>`).join("")}</div>
    ${defaultNote(c)}${answer()}`,

  c: c => {
    const rec = c.options.find(o => isRec(c, o));
    const others = c.options.filter(o => !isRec(c, o));
    return `${head(c)}
    <div class="pick">
      <div><span class="pill">RECOMMENDED</span></div>
      <div class="label" style="font-size:14px">${esc(rec.label)}</div>
      <div class="cons">${esc(rec.consequence)}</div>
      <div class="reason" style="font-style:normal">Why: ${esc(c.reason)}</div>
      <div class="go">${c.blocking ? "Go with this" : "Confirm"}</div>
    </div>
    ${defaultNote(c)}
    <div class="others-h">OR</div>
    <div>${others.map(o => `<div class="other"><div class="body"><div class="label">${esc(o.label)}</div><div class="cons">${esc(o.consequence)}</div></div><div class="arrow">›</div></div>`).join("")}</div>
    ${answer()}`;
  },
};

document.getElementById("pane").innerHTML = cases.map(c => `
  <div class="caption"><b>${c.caption}</b></div>
  <div class="msg">${esc(c.message)}</div>
  <div class="card ${c.blocking ? "wait" : ""}">${designs[design](c)}</div>`).join("");
</script>
</body>
</html>
